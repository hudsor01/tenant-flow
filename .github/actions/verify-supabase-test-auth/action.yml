name: Verify Supabase test credentials
description: >-
  Fail fast, with a named cause, when the synthetic test credentials a job is
  about to use are missing, legacy-format, or do not actually authenticate.

# WHY THIS EXISTS. Both production-data jobs (e2e-smoke in ci-cd.yml and
# rls-security in rls-security-tests.yml) used to carry their own copy of a
# "check required secrets" step. The copies drifted -- one checked four
# secrets, the other ten -- and both only tested that a value was NON-EMPTY.
# A secret that is present but WRONG sailed through the gate and surfaced ten
# seconds later as a vitest stack trace:
#
#   globalSetup: failed to sign in as ***: Invalid login credentials
#
# which looked like a flaky suite and was read that way for weeks. The same
# commit on the same branch passed when a human pushed it (Actions secrets) and
# failed when Dependabot rebased it (Dependabot secrets) -- the value under
# the Dependabot tab was simply wrong. Nothing named that; this does.
#
# WHAT IT DOES. For each credential pair it performs ONE real sign-in against
# GoTrue's password grant and immediately revokes the session, so the gate
# proves the pair works at the cost of one auth call and normally leaves nothing
# behind. When that sign-out cannot be completed -- a non-204, or a 200 whose
# body did not survive the transport -- it says so in a warning rather than
# leaving a live session unannounced, because the post-job revoke step does not
# run when the gate itself fails.
# On failure it emits a ::error:: that always names the pair and the cause, and
# names the HTTP status plus whatever code and message the responder returned
# when there was a response to read -- GoTrue's error_code for a 4xx about the
# pair, the API gateway's own message for a 401, which carries no error_code and
# so prints `unknown`. WHERE the implicated value is stored is named only when
# a stored value is actually implicated. The pair's own credentials are
# secrets, so for 400/403 it names WHICH secret store the job read -- Actions
# for a human-authored run, Dependabot for a dependabot[bot] run. The URL and
# the publishable key are repository variables, so for 401 (the publishable
# key), 404 (a URL serving no auth API) and a no-response (an unresolvable host
# makes the URL a candidate) it names the variables page instead. Nothing is
# named for a 429 or for any other status, where nothing identifies a stored
# value as the cause, so nobody rotates a secret over a transient. Both callers
# restate this same set, so a reader of either workflow sees the contract this
# file implements rather than an older one. Either way the fix is one sentence
# instead of an investigation.
#
# It runs BEFORE bun/node setup and needs only curl + jq (preinstalled on
# ubuntu-latest), so a bad secret fails in seconds, not after a 90s install.

inputs:
  supabase-url:
    description: NEXT_PUBLIC_SUPABASE_URL, a repository variable
    required: true
  publishable-key:
    description: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY (sb_publishable_*), a repository variable
    required: true
  credentials:
    description: >-
      Newline-separated `label=email:password` entries to verify, one per line,
      with each half supplied from the caller's secrets (e.g. the owner-a line is
      built from E2E_OWNER_EMAIL and E2E_OWNER_PASSWORD). Every listed pair is
      REQUIRED -- an empty email or password fails the gate. NOTE: this text must
      not contain a literal expression -- GitHub evaluates them inside action
      metadata, where the secrets context does not exist, and refuses to load
      the action. That is how the first version of this file failed.
    required: true
  secret-key:
    description: >-
      SUPABASE_SECRET_KEY (sb_secret_*). Optional; when given it must be present
      and must not be a legacy eyJ* JWT (legacy keys are disabled on this project).
    required: false
    default: ""
  require-secret-key:
    description: Fail if secret-key is empty. Set true for jobs that need privileged access.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Verify Supabase test credentials
      shell: bash
      env:
        SUPABASE_URL: ${{ inputs.supabase-url }}
        PUBLISHABLE_KEY: ${{ inputs.publishable-key }}
        CREDENTIALS: ${{ inputs.credentials }}
        SECRET_KEY: ${{ inputs.secret-key }}
        REQUIRE_SECRET_KEY: ${{ inputs.require-secret-key }}
        ACTOR: ${{ github.actor }}
      run: |
        set -euo pipefail

        # Which secret store did this run read? A Dependabot-authored run reads
        # the DEPENDABOT tab; everything else reads ACTIONS. Naming it is the
        # whole point -- a value that is right in one tab and wrong in the other
        # is indistinguishable from flakiness without this line.
        if [ "$ACTOR" = "dependabot[bot]" ]; then
          store="Settings -> Secrets and variables -> DEPENDABOT (this run was authored by dependabot[bot])"
        else
          store="Settings -> Secrets and variables -> ACTIONS"
        fi
        # The URL and the publishable key are not secrets: both callers pass
        # them from repository variables, which live on their own page.
        vars_page="Settings -> Secrets and variables -> Actions -> Variables"

        # fail MESSAGE [secrets|variables|none]. Naming where the stored value
        # lives is the whole point when a stored value is WRONG: the secret
        # store for the pair's own credentials (400/403, the default), the
        # variables page for the publishable key the gateway rejected (401) or
        # the URL that serves no auth API (404), and a no-response may be a URL
        # that does not resolve. It is a misdirection for a rate limit and for
        # any other status, where nothing identifies a stored value as the
        # cause, so those pass `none` and nobody rotates a secret over a
        # transient.
        fail() {
          echo "::error::$1"
          case "${2:-secrets}" in
            secrets)   echo "::error::Secret store for this run: $store" ;;
            variables) echo "::error::Repository variables: $vars_page" ;;
          esac
          exit 1
        }

        # ---- presence -------------------------------------------------------
        missing_vars=()
        [ -z "$SUPABASE_URL" ]    && missing_vars+=(NEXT_PUBLIC_SUPABASE_URL)
        [ -z "$PUBLISHABLE_KEY" ] && missing_vars+=(NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY)
        missing=()
        if [ "$REQUIRE_SECRET_KEY" = "true" ] && [ -z "$SECRET_KEY" ]; then
          missing+=(SUPABASE_SECRET_KEY)
        fi
        # Every credential line must have both halves. Report the LABEL, never
        # the value -- labels are ours, values are secrets.
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          label="${line%%=*}"; pair="${line#*=}"
          email="${pair%%:*}"; password="${pair#*:}"
          [ -z "$email" ]    && missing+=("${label}: email")
          [ -z "$password" ] && missing+=("${label}: password")
        done <<< "$CREDENTIALS"
        # Report both kinds before failing, each with the place to fix it, so a
        # run missing a variable AND a secret gets both fixes from one run.
        if [ ${#missing_vars[@]} -gt 0 ]; then
          echo "::error::Missing required repository variables: ${missing_vars[*]}"
          echo "::error::Repository variables: $vars_page"
        fi
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::Missing required secrets: ${missing[*]}"
          echo "::error::Secret store for this run: $store"
        fi
        if [ ${#missing_vars[@]} -gt 0 ] || [ ${#missing[@]} -gt 0 ]; then
          exit 1
        fi

        # ---- key format -----------------------------------------------------
        # Legacy anon/service_role JWTs were disabled on this project on
        # 2025-10-29. An eyJ* value authenticates as nothing and produces 41
        # failures that look like product bugs. Check the shape here, where the
        # message can say what is actually wrong.
        case "$PUBLISHABLE_KEY" in eyJ*) fail "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is a legacy JWT; legacy keys are disabled. Use the sb_publishable_ key." variables ;; esac
        case "$SECRET_KEY"      in eyJ*) fail "SUPABASE_SECRET_KEY is a legacy JWT; legacy keys are disabled. Use the sb_secret_ key." ;; esac

        # ---- do the credentials actually work? ------------------------------
        # One password-grant sign-in per pair, then an immediate logout so the
        # gate leaves no session behind. GoTrue answers a bad pair with
        #   400 {"code":400,"error_code":"invalid_credentials","msg":"Invalid login credentials"}
        # (shape verified against this project 2026-10-16), which we surface
        # verbatim alongside the label and store.
        token_url="${SUPABASE_URL%/}/auth/v1/token?grant_type=password"
        # scope=local revokes ONLY the session this probe just created. Without it
        # GoTrue's default is a GLOBAL sign-out of every session for that user,
        # which is both more than the probe needs and a race against anything
        # else holding a session for the same synthetic account.
        logout_url="${SUPABASE_URL%/}/auth/v1/logout?scope=local"
        verified=()
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          label="${line%%=*}"; pair="${line#*=}"
          email="${pair%%:*}"; password="${pair#*:}"
          # Both halves reach jq through the ENVIRONMENT and curl through STDIN
          # (-d @-) -- never argv, so neither is visible in the runner's process
          # list (GitHub: "avoid passing secrets between processes from the
          # command line"). The emails are GitHub secrets like the passwords.
          body=$(EM="$email" PW="$password" jq -cn '{email:env.EM,password:env.PW}')
          resp=$(mktemp)
          status=$(curl -sS -o "$resp" -w '%{http_code}' --max-time 30 \
            -X POST "$token_url" \
            -H "apikey: $PUBLISHABLE_KEY" -H 'Content-Type: application/json' \
            -d @- <<<"$body" || true)
          # curl writes `000` to stdout itself on a transport failure (DNS,
          # connect, timeout); a `|| echo 000` here used to APPEND a second
          # one, yielding `000000` and bypassing the no-response branch below.
          if [ "$status" != "200" ]; then
            # Default AFTER capture, not with jq's `//`. An EMPTY body gives jq
            # ZERO inputs: it prints nothing and exits 0, so the alternative
            # operator never evaluates and `|| echo unknown` is never reached.
            # The message degraded to `HTTP 502, : .` for exactly the responses
            # that carry no clue of their own.
            code=$(jq -r '.error_code // .error // empty' "$resp" 2>/dev/null || true)
            msg=$(jq -r '.msg // .error_description // .message // empty' "$resp" 2>/dev/null || true)
            # APPENDED, not another `//` term. The API gateway answers a
            # rejected publishable key with BOTH keys --
            # {"message":"Invalid API key","hint":"Double check your API
            # key."} -- and jq's `//` yields its first non-null operand, so a
            # `.hint` term after `.message` is unreachable for the one response
            # it was added for. Capture it separately and append it, so the
            # operator gets the gateway's message AND the thing to do about it.
            hint=$(jq -r '.hint // empty' "$resp" 2>/dev/null || true)
            # Every branch below exits through fail(), so the body has to go now
            # or it is left behind in the temp dir.
            rm -f "$resp"
            code=${code:-unknown}
            msg=${msg:-no message}
            if [ -n "$hint" ]; then msg="$msg ($hint)"; fi
            # Name the cause by STATUS, and name where the value is stored only
            # when a STORED value is the thing at fault -- the secret store for
            # the pair, the variables page for the publishable key and the URL:
            #   400/403 -- the pair's own email/password.
            #   401     -- the API gateway rejecting the publishable key before
            #              GoTrue sees the request: a wrong, truncated or
            #              rotated sb_publishable_ value, or a URL pointing at
            #              another project. The eyJ* guard above catches only
            #              legacy JWTs, so a stale new-format key reaches here.
            #   404     -- nothing at that address serves the auth API, which
            #              makes NEXT_PUBLIC_SUPABASE_URL the value to fix.
            #   none    -- no HTTP response at all: the host may not resolve, so
            #              NEXT_PUBLIC_SUPABASE_URL is a candidate here too.
            # A 429 carries GoTrue's own over_request_rate_limit and is per
            # runner IP, so it says nothing about any stored value. For any
            # other status nothing in the response identifies the responder or
            # a stored value as the cause, which is why no location is named
            # rather than guessed at: blaming a secret here would be this gate
            # committing the misdiagnosis it exists to prevent.
            case "$status" in
              ""|000)
                fail "Credential pair '${label}' could not be verified: no HTTP response (network/DNS/timeout). Is NEXT_PUBLIC_SUPABASE_URL right and the project reachable? The pair was not tested." variables ;;
              400|403)
                fail "Credential pair '${label}' does not authenticate: HTTP ${status}, ${code}: ${msg}. The email/password stored for this pair is wrong, or the account is missing or blocked." ;;
              401)
                fail "Credential pair '${label}' could not be verified: HTTP ${status}, ${code}: ${msg}. The Supabase API gateway rejected the request before GoTrue saw it: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is wrong, truncated or belongs to another project (or NEXT_PUBLIC_SUPABASE_URL points at another project). The pair was not tested." variables ;;
              429)
                fail "Credential pair '${label}' could not be verified: HTTP ${status}, ${code}: ${msg}. GoTrue rate-limited this runner's IP; the pair was NOT tested. Re-run the job; do not rotate the secret." none ;;
              404)
                fail "Credential pair '${label}' could not be verified: HTTP ${status}, ${code}: ${msg}. There is no auth endpoint at that address: NEXT_PUBLIC_SUPABASE_URL does not point at a Supabase project's API. The pair was not tested." variables ;;
              *)
                fail "Credential pair '${label}' could not be verified: HTTP ${status}, ${code}: ${msg}. The responder returned an unexpected status -- it may be GoTrue, the API gateway or whatever else answers that address -- and nothing in it identifies a stored secret as the cause. The pair was not tested." none ;;
            esac
          fi
          # GUARDED, because `set -e` made this one fatal in silence. A 200
          # whose body is truncated -- a reset, or `--max-time` firing AFTER the
          # headers, where curl exits 18/28 while `%{http_code}` already read
          # 200 and the `|| true` above deliberately discards that exit code --
          # killed the step with a bare `jq: parse error` and NO `::error::` at
          # all, which is the single thing this action exists to prevent. On main
          # the same response produced status `200000` (the `|| echo 000` bug
          # above) and so failed loudly by accident; fixing that exposed this.
          access=$(jq -r '.access_token // empty' "$resp" 2>/dev/null || true)
          if [ -n "$access" ]; then
            # Report the sign-out status. This probe's session is the one thing
            # the post-job revoke step cannot clean up: if the gate fails on a
            # LATER pair, the test step is skipped and that step is skipped
            # with it, so a silent 4xx/5xx here would leave this session alive
            # with nothing saying so. Never fails the gate -- a session that
            # outlives the probe is a warning, not a reason to block the run.
            logout_status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -X POST "$logout_url" \
              -H "apikey: $PUBLISHABLE_KEY" -H "Authorization: Bearer $access" || true)
            if [ "$logout_status" != "204" ]; then
              echo "::warning::sign-out of the verification probe for '${label}' returned HTTP ${logout_status:-000}; that session stays until a global revoke retires it -- if this job reaches its test step, its always() revoke step does that; if any step before the test step fails, it does not run and a later run's global revoke retires the session. Its access token lapses within the hour either way"
            fi
          else
            # HTTP 200 is GoTrue saying it CREATED the session, so the pair is
            # verified even when the body did not reach us intact. What is left
            # is a live session whose token we never read and therefore cannot
            # sign out. The post-job revoke would take it, but both callers gate
            # that step on the TEST step having run, so anything that skips the
            # test step -- this gate failing on a later pair, or an install
            # between here and it failing -- leaves the session behind. Say so
            # rather than leaving it silent.
            echo "::warning::the verification probe for '${label}' got HTTP 200 with no readable access_token; the pair authenticates, but this step cannot sign that probe session out. If this gate passes AND the job reaches its test step, the always() revoke step signs the account out globally and takes that session with it; if this gate fails on a later pair, or any step before the test step fails, the revoke does not run and that session stays until a later run's global revoke retires it -- its access token lapses within the hour, its refresh token does not"
          fi
          rm -f "$resp"
          verified+=("$label")
        done <<< "$CREDENTIALS"

        echo "Verified ${#verified[@]} credential pair(s) authenticate against $SUPABASE_URL: ${verified[*]}"
