name: Migration Replay

# Proves the migration ledger still applies to an EMPTY database.
#
# WHY THIS EXISTS. Until 2026-10-25 the 348-file ledger had never been replayed,
# and it could not be: it died twice, both times because production had been
# mutated outside the ledger and later migrations were written against that
# mutated state.
#   1. `extensions.wrappers` was installed by hand on prod before
#      install_stripe_wrapper was applied, so replay died at 246/348 with
#      `function extensions.stripe_fdw_handler() does not exist`.
#   2. The maintenance-photos table was dropped out-of-band by the landlord-only
#      pivot, so the migration that re-creates it uses `create table if not
#      exists` -- a silent no-op on a replay, leaving tenant-era policies that
#      blocked a column drop 110 migrations later (261/348).
#
# Neither was reachable by review and neither showed up in any existing job,
# because NOTHING in CI applies migrations -- `rls-security` tests whatever is
# already live in production. Without this workflow the next hand-applied prod
# change silently breaks replay again, which is precisely how it broke twice.
#
# WHAT IT DOES NOT DO. It does not prove the local schema MATCHES production.
# The repo ledger and prod's differ (measured 2026-10-25: 29 prod-only versions
# and 31 repo-only, almost all MCP-timestamp-renamed pairs of the same file, plus
# 20260416193000_security_revoke_idor_fixes which has NO prod ledger row at all
# while its effects are live). Comparing state rather than rows is a separate
# drift-check job; this one only answers "does the chain apply from empty".
# One slice of state is the exception:
# 20261102055400_reconcile_public_functions_with_production.sql raises, failing
# the replay step, unless at that point in the chain every public function has
# the pg_get_functiondef, ACL, volatility and SECURITY DEFINER flag production
# had on 2026-11-02. That covers public functions only, as of that file: no
# table, policy, trigger or cron job, and nothing a later file changes.
#
# It holds NO production secrets and signs in to nothing, so unlike e2e-smoke and
# rls-security it must NOT join the `tenantflow-prod-test-account` concurrency
# group -- it cannot contend with them and must not be serialized behind them.
#
# THE ASSERTIONS LIVE IN scripts/migration-replay-assertions.ts, NOT HERE. They
# were inline bash, and one of them was wrong the day it was written -- an
# expectation spelled `t`/`f` where psql renders `true`/`false` through `||`,
# which would have failed every run while reporting that the synthetic users
# were misconfigured. Nothing in the repo could have caught that, because
# nothing could run the comparison. They are tested code with negative controls
# now, and this file keeps only the querying.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/**
      - supabase/seed.sql
      - supabase/config.toml
      - scripts/seed-test-users.ts
      - scripts/migration-replay-assertions.ts
      - scripts/assert-migration-replay.ts
      - scripts/migration-replay-billing-insights.sql
      - scripts/migration-replay-property-performance.sql
      - scripts/migration-replay-owner-figures.sql
      - scripts/migration-replay-blog-banlist.sql
      # The negative controls, and the shared result module: a change that
      # weakens a control has to run the gate it guards. (The result module's
      # own controls are in scripts/assertion-result.test.ts, because a green
      # gate never calls its annotation helpers.)
      - scripts/migration-replay-assertions.test.ts
      - scripts/assertion-result.ts
      - .github/workflows/migration-replay.yml
  # Weekly, because the chain can be broken by a change made directly to
  # production that never touches this repo at all -- the exact failure mode
  # above. A PR-only trigger would never catch it.
  schedule:
    - cron: "41 12 * * 1"
  workflow_dispatch:

concurrency:
  group: migration-replay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A GATE THAT PASSES PROVES NOTHING UNTIL SOMETHING HAS WATCHED IT FAIL.
      # These are the negative controls for the assertions below: each is
      # fed the input it should accept and every wrong input that matters, the
      # `t`/`f` regression described in the header included. They are part of
      # the unit suite, so the `checks` job runs them on every PR as well --
      # running them HERE is what covers the weekly scheduled run, where
      # `checks` never executes. Before the stack starts, because a broken
      # assertion makes the rest of this job meaningless.
      - name: Test the replay assertions
        run: bun run test:unit -- scripts/migration-replay-assertions.test.ts

      - name: Replay the full migration chain into an empty database
        run: |
          set -euo pipefail
          # Excluded services are irrelevant to schema replay and cost startup
          # time. gotrue (auth) is NOT excluded: the seed step needs the Admin API.
          supabase start -x studio,imgproxy,vector,logflare,supavisor

      - name: Assert every migration file was applied
        run: |
          set -euo pipefail
          # Counted from the tree, never hardcoded, so this stays correct as
          # migrations are added.
          expected=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')
          # psql ONLY. This used to try `supabase db query` first and fall back
          # to psql, on a comment claiming CLIs differ on that subcommand --
          # 2.121.0, which this workflow pins, has it, and it even has
          # `--output-format json`, so that justification was wrong too. The
          # reason to drop it is simpler: two paths to one number meant the
          # extraction had to satisfy both, and the unanchored grep that did
          # took the last number from ANY stdout (a `(1 row)` footer, a usage
          # dump). `psql -tAc` is tuples only, unaligned, exactly one number,
          # and the step already depends on this container for its other two
          # assertions.
          applied=$(docker exec supabase_db_tenant-flow psql -U postgres -tAc \
            "select count(*) from supabase_migrations.schema_migrations;")
          echo "migration files: ${expected}"
          echo "applied rows:    ${applied}"
          bun scripts/assert-migration-replay.ts applied "$expected" "$applied"

      - name: Assert no migration reached the network
        run: |
          set -euo pipefail
          # install_stripe_wrapper's step 4 runs `import foreign schema stripe
          # from server stripe_server`, a LIVE Stripe API call. It is guarded on
          # the Vault secret, which exists only on prod. If that guard ever stops
          # holding, a migration starts calling Stripe from CI -- assert it did
          # not. The wrapper extension SHOULD be installed; the server and the
          # imported foreign tables should NOT exist here.
          read -r wrapper server tables <<<"$(docker exec supabase_db_tenant-flow psql -U postgres -tAc \
            "select (select count(*) from pg_extension where extname='wrappers'),
                    (select count(*) from pg_foreign_server where srvname='stripe_server'),
                    (select count(*) from pg_class c join pg_namespace n on c.relnamespace=n.oid
                      where n.nspname='stripe' and c.relkind='f');" | tr '|' ' ')"
          echo "wrappers extension: ${wrapper}  stripe_server: ${server}  foreign tables: ${tables}"
          bun scripts/assert-migration-replay.ts no-network "$wrapper" "$server" "$tables"

      - name: Seed the test cast and verify each pair authenticates
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/stack.env
          get() { grep -E "^$1=" /tmp/stack.env | head -1 | cut -d= -f2- | tr -d '"'; }
          API_URL="$(get API_URL)" SECRET_KEY="$(get SECRET_KEY)" \
            bun scripts/seed-test-users.ts

      - name: Assert the seeded rows are what the suites require
        run: |
          set -euo pipefail
          # Each row is <email>|<is_admin>|<subscription_status>|<auth.identities
          # count>. The identity count is the point: seed.sql's hand-rolled
          # crypt() inserts created ZERO auth.identities, which is why its users
          # could never have signed in. The expectation, and the explanation of
          # how psql spells the boolean through `||`, live in
          # scripts/migration-replay-assertions.ts.
          # `coalesce` ON subscription_status IS LOAD-BEARING. It is nullable,
          # and `||` with a NULL operand yields NULL -- so one unset column made
          # psql print an EMPTY LINE for that whole row, which the assertion's
          # whitespace filter dropped, and the gate reported "the three e2e
          # users do not exist" while they existed with one column unset. That
          # is the misdiagnosis class this gate was rewritten to eliminate.
          #
          # NOT on u.email: `where u.email like ...` already excludes a NULL
          # email, because `NULL LIKE` is NULL. A coalesce there would be
          # unreachable. `p.is_admin` is `boolean not null default false`
          # (20260418235000_drop_user_type_to_is_admin.sql).
          rows=$(docker exec supabase_db_tenant-flow psql -U postgres -tAc \
            "select u.email || '|' || p.is_admin || '|' ||
                    coalesce(p.subscription_status, '<null-status>') || '|' ||
                    (select count(*) from auth.identities i where i.user_id = u.id)
             from auth.users u join public.users p on p.id = u.id
             where u.email like 'e2e-%@tenantflow.app' order by u.email;")
          printf '%s\n' "$rows"
          printf '%s\n' "$rows" | bun scripts/assert-migration-replay.ts test-cast

      - name: Assert get_billing_insights computes its figures from the ledger
        run: |
          set -euo pipefail
          # From 20260528231201 until 20261102055449 the function returned
          # unpaidTotal, unpaidCount and lateFeeTotal as the literal 0, so every
          # owner's Payment Summary read 0 while the rent ledger held the real
          # figures -- and no job could see it, because none ran the function
          # against a ledger (rls-security only asserts who may call it). The
          # same fixture asserts the balance sheet's figures, as of a date.
          # The fixture seeds a ledger for the two seeded owners (so it runs
          # after the cast step), calls the function as each owner, prints ONE
          # JSON line and rolls back. The expected figures, and the arithmetic
          # behind each, live in scripts/migration-replay-assertions.ts.
          # A herestring rather than a pipe, so under pipefail the step's status
          # is the assertion's alone and never a writer's SIGPIPE.
          result=$(docker exec -i supabase_db_tenant-flow psql -U postgres -X -q -t -A \
            -v ON_ERROR_STOP=1 < scripts/migration-replay-billing-insights.sql)
          printf '%s\n' "$result"
          bun scripts/assert-migration-replay.ts billing-insights <<<"$result"

      - name: Assert get_property_performance_analytics reports rent received
        run: |
          set -euo pipefail
          # From 20260528231201 until 20261102163709 the function returned
          # the literal 0 (0::bigint, and 0::numeric from 20260708131721) as
          # every property's total_revenue, so its net income was
          # its expenses negated on the analytics page, the property page, the
          # property export and the year-end report and its tax exports -- and
          # it could not be asked for a tax year at all. The fixture seeds
          # properties, leases, receipts and expenses for the two seeded owners
          # (so it runs after the cast step), calls the function as each owner
          # for a tax year and a trailing window, prints ONE JSON line and rolls
          # back. The expected rows, and the arithmetic behind each, live in
          # scripts/migration-replay-assertions.ts. A herestring, as above.
          result=$(docker exec -i supabase_db_tenant-flow psql -U postgres -X -q -t -A \
            -v ON_ERROR_STOP=1 < scripts/migration-replay-property-performance.sql)
          printf '%s\n' "$result"
          bun scripts/assert-migration-replay.ts property-performance <<<"$result"

      - name: Assert the dashboard, expense and maintenance figures are computed
        run: |
          set -euo pipefail
          # Until 20261102184501..20261102184504, get_dashboard_stats returned
          # occupancyChange and revenue growth as 0, get_dashboard_data_v2
          # compared today's leases with only the leases still active today
          # and drew its 30-day and 6-month series from those alone,
          # get_expense_summary returned year_over_year_change as null,
          # get_maintenance_analytics returned every cost as 0 or [], and
          # get_financial_overview returned receivables, payables and trends as
          # literals no caller reads (and no lease's profitability), and until
          # 20261102200501 get_occupancy_trends_optimized counted a soft-deleted
          # unit's lease -- and no job ran any of them against data. The
          # fixture seeds leases, rent receipts, maintenance requests and expenses
          # for the three seeded users (so it runs after the cast step), calls
          # each function as its owner, prints ONE JSON line and rolls back.
          # The expected figures, and the arithmetic behind each, live in
          # scripts/migration-replay-assertions.ts. A herestring, as above.
          result=$(docker exec -i supabase_db_tenant-flow psql -U postgres -X -q -t -A \
            -v ON_ERROR_STOP=1 < scripts/migration-replay-owner-figures.sql)
          printf '%s\n' "$result"
          bun scripts/assert-migration-replay.ts owner-figures <<<"$result"

      - name: Assert validate_blog_post bans the persona word and checks every field
        run: |
          set -euo pipefail
          # Until 20261102230101 the blog trigger's banlist read NEW.content only
          # and carried no persona word, so a post whose excerpt said
          # "single-property owner" published to /blog, where
          # persona-consistency.spec.ts bans /property owners?\b/i -- and no
          # job ran the trigger. The fixture inserts posts as service_role (the
          # ingest function's role, with no EXECUTE on the trigger function),
          # prints ONE JSON line and rolls back; it needs no seeded user. The
          # expected outcome of every case lives in
          # scripts/migration-replay-assertions.ts. A herestring, as above.
          result=$(docker exec -i supabase_db_tenant-flow psql -U postgres -X -q -t -A \
            -v ON_ERROR_STOP=1 < scripts/migration-replay-blog-banlist.sql)
          printf '%s\n' "$result"
          bun scripts/assert-migration-replay.ts blog-banlist <<<"$result"

      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup || true
