name: RLS Security Tests

# Primary gate: run on every PR to main (catches RLS drift regardless of changed files).
# Post-merge run on main re-executes the full suite under the Actions secret scope
# so any Dependabot bump that bypassed the PR-level RLS gate (via the step-level
# Dependabot short-circuit) fails loud immediately on merge instead of waiting
# up to a week for the weekly cron.
# Weekly cron is the backup safety net for policy drift between PRs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # Every Monday 09:00 UTC
  workflow_dispatch:

concurrency:
  group: rls-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rls-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Dependabot handling: Dependabot-triggered runs on pull_request
    # events use the Dependabot secret scope (separate from Actions).
    # On Dependabot PR events, every secret-dependent step short-circuits
    # and the job reports `success` to satisfy required-status-checks.
    #
    # The guards check BOTH `event_name == 'pull_request'` AND `actor ==
    # 'dependabot[bot]'`, so a `push: branches: [main]` run is not
    # short-circuited.
    #
    # DO NOT restore the claim this comment used to make — that the post-merge
    # push run always happens "even when Dependabot auto-merge finalized the
    # PR", so any regression fails loud before affecting users. THAT IS FALSE.
    # When dependabot-auto-merge.yml merges via GITHUB_TOKEN, GitHub's recursion
    # guard suppresses the resulting push ENTIRELY — no workflow runs at all.
    # Verified 2026-07-27: `gh api repos/.../commits/99cc8413/check-runs` (the
    # merge commit for the auto-merged next 16.2.11 bump) returned ONLY the
    # post-deploy Sentry gate. No CI, no e2e-smoke, no rls-security, no CodeQL.
    #
    # PRECISION: that does not mean that bump shipped untested. Its PR head
    # (3d1f4d8b, PR #928) ran rls-security for 122s and e2e-smoke for 235s —
    # real executions — because a maintainer bun.lock commit had been pushed to
    # it, and a maintainer commit changes the trigger context so the suites run
    # for real. The merge commit showing only the gate is the recursion guard,
    # not absence of testing.
    #
    # The hole is real for the case with NO maintainer commit: a pure Dependabot
    # PR gets a vacuous green here, and if auto-merged under GITHUB_TOKEN the
    # push is suppressed, so this suite runs nowhere until the weekly Monday
    # cron. That is why auto-merge is now a narrow positive allowlist excluding
    # everything able to reach the production runtime.
    #
    # See e2e-smoke comment in ci-cd.yml for the full rationale.
    steps:
      - name: Skip notice on Dependabot PRs
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        run: |
          echo "::warning title=rls-security did not run::This job reported success WITHOUT executing. Dependabot PRs receive no Actions secret scope, so the suite cannot authenticate. This PR has NOT been RLS-tested."
          {
            echo "### rls-security: SKIPPED (vacuous green)"
            echo
            echo "This job reported success **without running any tests**."
            echo
            echo "- Cause: Dependabot-triggered runs get no Actions secret scope."
            echo "- If this PR is auto-merged, the post-merge push is suppressed by GitHub's"
            echo "  \`GITHUB_TOKEN\` recursion guard, so the suite will not run then either."
            echo "- Next real execution is the weekly Monday cron."
            echo "- To make this check real: add Dependabot-scoped secrets (see ci-cd.yml)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Suppress git default branch hint
        if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
        run: git config --global init.defaultBranch main

      - name: Checkout
        if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail hard when any required secret is missing. The previous
      # silent-skip pattern made every PR show "rls-security pass" while
      # actually running zero tests — which is how the cycle-4 P0
      # bulk-import bug and the lease_tenants SELECT-policy gap shipped
      # to prod undetected. Mirror the post-deploy-sentry-gate pattern.
      - name: Check required secrets
        if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
        run: |
          missing=()
          [ -z "$SUPABASE_URL" ]             && missing+=(NEXT_PUBLIC_SUPABASE_URL)
          [ -z "$SUPABASE_PUBLISHABLE_KEY" ] && missing+=(NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY)
          [ -z "$OWNER_A_EMAIL" ]            && missing+=(E2E_OWNER_EMAIL)
          [ -z "$OWNER_A_PASS" ]             && missing+=(E2E_OWNER_PASSWORD)
          [ -z "$OWNER_B_EMAIL" ]            && missing+=(E2E_OWNER_B_EMAIL)
          [ -z "$OWNER_B_PASS" ]             && missing+=(E2E_OWNER_B_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub repo secrets: ${missing[*]}"
            echo "::error::Add them in Settings → Secrets and variables → Actions before this gate can pass."
            exit 1
          fi
          echo "All required secrets present"
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          OWNER_A_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          OWNER_A_PASS: ${{ secrets.E2E_OWNER_PASSWORD }}
          OWNER_B_EMAIL: ${{ secrets.E2E_OWNER_B_EMAIL }}
          OWNER_B_PASS: ${{ secrets.E2E_OWNER_B_PASSWORD }}

      - name: Setup Bun
        if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
        run: bun install --frozen-lockfile

      - name: Run RLS security tests
        if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_OWNER_B_EMAIL: ${{ secrets.E2E_OWNER_B_EMAIL }}
          E2E_OWNER_B_PASSWORD: ${{ secrets.E2E_OWNER_B_PASSWORD }}
        run: bun run test:integration
