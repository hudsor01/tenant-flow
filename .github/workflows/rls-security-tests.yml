name: RLS Security Tests

# Primary gate: run on every PR to main (catches RLS drift regardless of changed files).
#
# Runs on every PR (including Dependabot's, for real since 2026-07-27) and on
# every push to main.
#
# Note on auto-merged PRs: when dependabot-auto-merge.yml merges under
# GITHUB_TOKEN, GitHub's recursion guard suppresses the resulting push entirely,
# so this workflow does not run post-merge for that path. The PR-level run is
# therefore the only pre-production execution an auto-merged bump gets, which is
# why the Dependabot short-circuit had to go.
#
# Weekly cron is the backup safety net for policy drift between PRs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # Every Monday 09:00 UTC
  workflow_dispatch:

concurrency:
  group: rls-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rls-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # SERIALIZED AGAINST THE OTHER PRODUCTION-DATA JOB. e2e-smoke and
    # rls-security both authenticate as E2E_OWNER_EMAIL against the SAME
    # production project, and they used to start on the same second on every PR.
    # Two concurrent writers on one account is not a flake, it is a race with
    # two proven manifestations: a global-scope signOut in an e2e teardown
    # revoked the RLS suite's cached session mid-run (54 x 403 then 75 fallback
    # sign-ins), and RLS fixture cleanup deleted a property between the
    # dashboard test's RPC snapshot and its page render (expected 23, got 22).
    # A shared group with cancel-in-progress false makes them QUEUE rather than
    # cancel, so both still run on every PR -- sequentially. Costs wall time;
    # buys a suite that measures the product instead of the other job.
    #
    # The durable fix is a separate synthetic account per suite, which needs new
    # credentials the CI cannot mint for itself. Recorded in deferred-items.
    #
    # `queue: max` must match the e2e-smoke side. A group holds one pending
    # entry by default and cancels it when a newer entry arrives, so the two
    # jobs evicted each other instead of queueing -- see the longer note in
    # ci-cd.yml. Depth 100, FIFO.
    #
    # Not keyed on `github.ref` -- one production project and one owner account
    # is a global resource, so a per-ref key let concurrent branches write over
    # each other. See the longer note in ci-cd.yml.
    concurrency:
      group: tenantflow-prod-test-account
      cancel-in-progress: false
      queue: max

    # Dependabot PRs run this for REAL as of 2026-07-27.
    #
    # This job used to short-circuit on Dependabot PRs because the Dependabot
    # secret scope was empty, reporting `success` in ~3s without executing a
    # single RLS assertion. For a SECURITY gate that is the worst possible
    # failure mode — it certifies isolation it never checked.
    #
    # All six required secrets now exist in the Dependabot scope, so the skip
    # guards are gone and the required-secrets check below gates everyone
    # equally. Drift now fails loudly rather than passing vacuously.
    #
    # Do NOT reintroduce an `actor == 'dependabot[bot]'` skip here.
    #
    # See e2e-smoke comment in ci-cd.yml for the full rationale.
    steps:
      - name: Suppress git default branch hint
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # VERIFY, DO NOT MERELY CHECK. The previous step tested that each secret
      # was non-empty and passed; a secret that was present but WRONG then
      # surfaced ten seconds later as a vitest stack trace that read as a flaky
      # suite for weeks. Same commit, same branch: a human push (Actions secrets)
      # passed, a dependabot[bot] rebase (Dependabot secrets) failed -- the
      # value under the Dependabot tab was simply wrong, and nothing said so.
      # The shared action performs one real sign-in per pair, revokes it, and on
      # failure names the pair and the cause, the responder's code and message
      # when there was a response, and WHICH secret store this run read only when
      # a stored secret is actually implicated. That set is the action's contract,
      # spelled out here and in ci-cd.yml so neither caller can understate it:
      # named for 400/403 (the pair), 401 (the publishable key),
      # 404 (a URL serving no auth API) and a no-response (an unresolvable
      # host makes the URL a candidate); withheld for a 429 and for any other
      # status the right host answered with, so nobody rotates a secret over a
      # transient.
      # It needs only curl+jq, so it runs before any install.
      # The silent-skip pattern this replaced is still the thing being
      # prevented: a gate that passes while zero tests run is worse than none.
      - name: Verify Supabase test credentials
        uses: ./.github/actions/verify-supabase-test-auth
        with:
          supabase-url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          publishable-key: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          # Owner A, owner B and the admin are all REQUIRED. The admin pair
          # existed since April but was never passed to the job, so
          # getAdminTestCredentials() returned null and ten admin-scoped tests
          # skipped on every run -- the same vacuous pass one layer down.
          credentials: |
            owner-a=${{ secrets.E2E_OWNER_EMAIL }}:${{ secrets.E2E_OWNER_PASSWORD }}
            owner-b=${{ secrets.E2E_OWNER_B_EMAIL }}:${{ secrets.E2E_OWNER_B_PASSWORD }}
            admin=${{ secrets.E2E_ADMIN_EMAIL }}:${{ secrets.E2E_ADMIN_PASSWORD }}
          # The sb_secret_* key. Supabase retired the "service_role" vocabulary
          # with the new key model; the GitHub secret under that old name was
          # deleted on 2026-10-19, so only SUPABASE_SECRET_KEY exists now.
          # Without it 163 of 531 tests skipped while the job reported success.
          secret-key: ${{ secrets.SUPABASE_SECRET_KEY }}
          require-secret-key: "true"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run RLS security tests
        id: rls
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_OWNER_B_EMAIL: ${{ secrets.E2E_OWNER_B_EMAIL }}
          E2E_OWNER_B_PASSWORD: ${{ secrets.E2E_OWNER_B_PASSWORD }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        # ZERO-SKIP IS PART OF PASSING. `bun run test:integration` exits 0
        # whether it executed 531 tests or 368, so for the entire life of this
        # job "pass" and "ran a third less than it thinks" were indistinguishable
        # -- which is how the rate-limiter concurrency proof sat unexecuted while
        # a required security check stayed green. One run, then read its own
        # count: re-running would double ~45 sign-ins against a rate-limited
        # production auth endpoint.
        run: |
          set -o pipefail
          bun run test:integration 2>&1 | tee /tmp/rls.log
          if grep -qE "[0-9]+ skipped" /tmp/rls.log; then
            echo "::error::RLS tests SKIPPED. A skipped security test is not a passing one."
            grep -E "Test Files|Tests " /tmp/rls.log | tail -2
            exit 1
          fi
          grep -E "Test Files|Tests " /tmp/rls.log | tail -2

      # REVOKE EVERY ACCOUNT'S SESSIONS AFTER THE RUN. globalSetup signs in all
      # three (owner-a, owner-b, admin) and caches their access + refresh
      # tokens for the suite; nothing in the suite signs them out. Same shared
      # action as e2e-smoke; scope=global is safe because the two jobs are
      # serialised by the concurrency group above. Runs on failure, cancellation
      # and job timeout, but not when the test step was skipped (gate or
      # install failed) -- the only session that can exist then is the gate's
      # own probe, which the gate signs out itself and warns about when it
      # cannot. Never fails the job.
      - name: Revoke test-account sessions
        if: ${{ always() && steps.rls.outcome != 'skipped' }}
        uses: ./.github/actions/revoke-supabase-test-sessions
        with:
          supabase-url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          publishable-key: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          credentials: |
            owner-a=${{ secrets.E2E_OWNER_EMAIL }}:${{ secrets.E2E_OWNER_PASSWORD }}
            owner-b=${{ secrets.E2E_OWNER_B_EMAIL }}:${{ secrets.E2E_OWNER_B_PASSWORD }}
            admin=${{ secrets.E2E_ADMIN_EMAIL }}:${{ secrets.E2E_ADMIN_PASSWORD }}
