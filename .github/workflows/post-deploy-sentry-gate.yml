# Post-Deploy Sentry Regression Gate (Phase 43 / DEPLOY-01, DEPLOY-02)
#
# What this does:
#   After a production Vercel deploy, wait an observation window, query Sentry
#   against the deployed release SHA, compare issue/error-rate profile against
#   the previous release's baseline artifact, and fail the workflow + open a
#   GitHub issue if any threshold is breached.
#
# Triggers:
#   - repository_dispatch: vercel.deployment.success | vercel.deployment.promoted
#     (Vercel's canonical 2026 integration — requires Vercel project Git settings
#      to have deployment events enabled; verify Project → Settings → Git in Vercel.)
#   - workflow_dispatch with input `release_sha` for manual smoke testing / re-runs.
#
# Smoke test (run after merging to main):
#   gh workflow run post-deploy-sentry-gate.yml -f release_sha=<known-good-shipped-sha>
#   gh run watch
#   # Expect green exit, PASS summary, and artifact `sentry-baseline-<sha>` uploaded.
#
# Required repo secrets:
#   SENTRY_AUTH_TOKEN  — MUST be a PERSONAL TOKEN, not an Organization Token.
#                        Create at sentry.io → Account dropdown (top left) →
#                        Personal Tokens. Scopes: event:read, project:read,
#                        org:read.
#
#                        This line previously said "Organization Token", and that
#                        is WRONG in a way that fails confusingly. Organization
#                        Tokens have FIXED, non-editable permissions scoped to
#                        "CI-related tasks" — releases and source-map upload —
#                        and cannot read issues or events. Verified 2026-07-28
#                        against a freshly issued org token:
#                          /organizations/{org}/releases/  -> 200
#                          /organizations/{org}/issues/    -> 403
#                          /projects/{org}/{project}/      -> 403
#                        The gate's whole job is reading issues, so an org token
#                        gets through the credentials check and then dies at the
#                        first real query.
#   SENTRY_ORG         — Sentry org slug. Must match the value the Vercel BUILD
#                        uses (next.config.ts reads process.env.SENTRY_ORG in the
#                        withSentryConfig options), but note these are two
#                        SEPARATE secret stores: the build reads Vercel's project
#                        env, this workflow reads the GitHub Actions secret. They
#                        can drift, and a mismatch shows up here as a 404.
#   SENTRY_PROJECT     — Sentry project slug, same two-store caveat.
#
#   (Earlier revisions cited next.config.ts:50/:51 for these. Line numbers in
#   that file drift with every edit — the options live in the withSentryConfig
#   call at the bottom; grep for SENTRY_ORG rather than trusting a line number.)
#
# Required repo variables (all tunable without code change via `gh variable set`):
#   SENTRY_GATE_NEW_ISSUE_EVENT_THRESHOLD  (default 10)
#   SENTRY_GATE_ERROR_RATE_DELTA_PCT       (default 1.0)
#   SENTRY_GATE_OBSERVATION_WINDOW_MINUTES (default 30)
#
# Threshold tuning: after 5+ production deploys, review opened issues vs false
# positives. Tighten or relax via `gh variable set SENTRY_GATE_<NAME> --body <value>`.
#
# Out of scope (per 43-DECISIONS.md): Vercel rollback, Slack/PagerDuty webhooks,
# rolling-median baseline, preview-deploy gating, performance (p95) threshold enforcement.

name: Post-Deploy Sentry Regression Gate

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
      - vercel.deployment.promoted
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Git SHA to audit (for smoke tests or manual re-runs against a known-good release)'
        required: true
        type: string
      skip_observation:
        description: 'Skip the observation window (smoke-testing the gate wiring only — the data will be thinner than a real post-deploy run)'
        required: false
        default: false
        type: boolean

concurrency:
  group: sentry-gate-${{ github.event.client_payload.git.sha || inputs.release_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      NEW_ISSUE_EVENT_THRESHOLD: ${{ vars.SENTRY_GATE_NEW_ISSUE_EVENT_THRESHOLD || '10' }}
      ERROR_RATE_DELTA_PCT: ${{ vars.SENTRY_GATE_ERROR_RATE_DELTA_PCT || '1.0' }}
      OBSERVATION_WINDOW_MINUTES: ${{ vars.SENTRY_GATE_OBSERVATION_WINDOW_MINUTES || '30' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check required secrets
        run: |
          missing=()
          [ -z "${SENTRY_AUTH_TOKEN:-}" ] && missing+=(SENTRY_AUTH_TOKEN)
          [ -z "${SENTRY_ORG:-}" ]        && missing+=(SENTRY_ORG)
          [ -z "${SENTRY_PROJECT:-}" ]    && missing+=(SENTRY_PROJECT)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      # Validate credentials BEFORE the 30-minute observation sleep.
      #
      # This gate has NEVER once passed. Measured 2026-07-27 over the most recent
      # 200 runs the API returns: 199 failures, 0 successes, 144.6 hours of
      # cumulative runtime. (An earlier revision of this comment said "40 out of
      # 40" and "roughly 20 hours" — those came from a `gh run list --limit 40`
      # that silently capped at its own limit. The real figures are ~5x and ~7x
      # worse; re-measure with an explicit high limit rather than trusting a
      # default.)
      #
      # Nearly all of that runtime is this job sleeping the full observation
      # window and then blaming the application build.
      #
      # The release lookup below is org-scoped, so a wrong SENTRY_ORG or a token
      # belonging to a different org returns 404 — indistinguishable from "the
      # build never created the release" unless the org is checked separately.
      # Verified 2026-07-27: release 6d7cfb8e07cd… DOES exist in Sentry (org
      # hudson-digital-solutions, project tenant-flow, created 14:10:43Z), and
      # so does every earlier deploy back to June. The builds were always fine.
      - name: Verify Sentry credentials resolve
        run: |
          # Probe the ISSUES endpoint — the one the gate actually depends on.
          #
          # This probed /releases/ until 2026-07-28, and that was too weak a
          # test. An Organization Token can read releases but NOT issues, so the
          # preflight reported "credentials verified" for a token that could not
          # do the gate's job, and the run then died 30 minutes later at the
          # first real query. A preflight that passes for a token the gate cannot
          # use is worse than none: it moves the failure further from its cause.
          #
          # `limit=1` keeps it cheap; only the status code is examined.
          # `|| echo 000` is load-bearing. GitHub Actions runs `run:` blocks as
          # `bash -e`, so on a curl TRANSPORT failure (DNS, TLS, connection reset)
          # the non-zero exit would abort this step immediately — before the case
          # statement — and the job would fail with no ::error:: annotation at all,
          # which is the exact silent-failure mode this step exists to remove.
          # Substituting a sentinel keeps the diagnosis on the happy path.
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://sentry.io/api/0/organizations/${SENTRY_ORG}/issues/?limit=1" \
            -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" || echo "000")
          case "${STATUS}" in
            200)
              echo "Sentry credentials verified; token can read this org's issues."
              ;;
            000)
              echo "::error::Could not reach the Sentry API at all (curl transport failure)."
              echo "::error::Network/DNS/TLS problem on the runner, or a Sentry outage."
              echo "::error::This is NOT an application build problem."
              exit 1
              ;;
            401)
              echo "::error::SENTRY_AUTH_TOKEN was rejected (401) — invalid or expired."
              echo "::error::Reissue it: Sentry > Settings > Developer Settings > Organization Tokens."
              echo "::error::This is a CI credentials problem, NOT an application build problem."
              exit 1
              ;;
            403)
              # Fingerprint what the token CAN do, so the operator is told which
              # specific scope is missing instead of re-guessing the token type.
              # Each endpoint maps to exactly one scope, so the pattern of
              # 200s and 403s identifies both the token kind and the gap.
              probe() {
                curl -sS -o /dev/null -w "%{http_code}" \
                  "https://sentry.io/api/0/$1" \
                  -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" 2>/dev/null || echo "000"
              }
              P_ORG=$(probe "organizations/${SENTRY_ORG}/")
              P_PROJ=$(probe "projects/${SENTRY_ORG}/${SENTRY_PROJECT}/")
              P_REL=$(probe "organizations/${SENTRY_ORG}/releases/?per_page=1")

              echo "::error::SENTRY_AUTH_TOKEN cannot read issues for this org (403)."
              echo "::error::"
              echo "::error::Scope fingerprint (200 = granted, 403 = missing):"
              echo "::error::  org:read         ${P_ORG}   (/organizations/{org}/)"
              echo "::error::  project:read     ${P_PROJ}   (/projects/{org}/{project}/)"
              echo "::error::  project:releases ${P_REL}   (/organizations/{org}/releases/)"
              echo "::error::  event:read       403   (/organizations/{org}/issues/) <-- REQUIRED, MISSING"
              echo "::error::"
              if [ "${P_REL}" = "200" ] && [ "${P_PROJ}" != "200" ]; then
                echo "::error::Releases readable but project details not: this is the signature of an"
                echo "::error::ORGANIZATION token. Those have FIXED CI-only permissions and can never"
                echo "::error::read issues, no matter which boxes you tick."
              else
                echo "::error::This looks like a PERSONAL token that is simply missing event:read."
                echo "::error::Edit the token and tick that scope, or create a new one."
              fi
              echo "::error::"
              echo "::error::Required: a PERSONAL token from"
              echo "::error::  https://sentry.io/settings/account/api/auth-tokens/"
              echo "::error::with event:read + project:read + org:read, then:"
              echo "::error::  gh secret set SENTRY_AUTH_TOKEN"
              echo "::error::(NOT https://sentry.io/settings/auth-tokens/ — that page is org tokens.)"
              echo "::error::This is a CI credentials problem, NOT an application build problem."
              exit 1
              ;;
            404)
              echo "::error::The org in SENTRY_ORG did not resolve (404)."
              echo "::error::Either SENTRY_ORG is wrong, or SENTRY_AUTH_TOKEN belongs to a different"
              echo "::error::org — Sentry returns 404 rather than 403 so it does not confirm whether"
              echo "::error::an org exists to a caller that cannot see it."
              echo "::error::This is a CI credentials problem, NOT an application build problem."
              exit 1
              ;;
            *)
              echo "::error::Sentry organizations API returned HTTP ${STATUS}."
              exit 1
              ;;
          esac

      # Resolve the project SLUG to its NUMERIC ID.
      #
      # The three Sentry query steps below hit org-scoped endpoints
      # (/organizations/{org}/issues/, /sessions/, /events/) whose `project`
      # parameter is a numeric project ID. Passing a slug returns HTTP 400, and
      # because those steps use `curl -f` that surfaced only as `exit code 22`
      # with no explanation. Observed 2026-07-28 on the first run that ever got
      # past the credentials check.
      #
      # Resolved at runtime rather than by changing the SENTRY_PROJECT secret to
      # a number, so the secret keeps matching the slug the Vercel build uses in
      # next.config.ts. One value, one meaning, in both stores.
      - name: Resolve Sentry project ID
        id: project
        run: |
          # Use the PROJECT-scoped details endpoint
          # (/projects/{org}/{project}/), NOT the org-scoped project LIST
          # (/organizations/{org}/projects/).
          #
          # The list endpoint requires `org:read`, which this workflow
          # deliberately does not require — and it 403'd on the first run that
          # reached it (30360756947). That is the same org-vs-project scope
          # mistake already fixed once in the credentials preflight above;
          # do not reintroduce it a third time. If a step here needs a scope
          # beyond `project:read` + `event:read`, the step is wrong, not the
          # token.
          RESP=$(curl -sS -w '\n%{http_code}' \
            "https://sentry.io/api/0/projects/${SENTRY_ORG}/${SENTRY_PROJECT}/" \
            -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" || printf '\n000')
          CODE=$(printf '%s' "$RESP" | tail -1)
          BODY=$(printf '%s' "$RESP" | sed '$d')

          PID=""
          if [ "${CODE}" = "200" ]; then
            PID=$(printf '%s' "$BODY" | jq -r '.id // empty')
          fi

          # FALLBACK: derive the id from the RELEASES list.
          #
          # Whatever scope set this token carries, the credentials preflight
          # above already proved it can read /organizations/{org}/releases/ —
          # and each release object embeds `projects: [{id, slug, ...}]`. So
          # this path needs no scope the gate does not already depend on, which
          # makes it immune to the org-vs-project scope trap that has now bitten
          # this workflow twice.
          if [ -z "${PID}" ]; then
            echo "Project details returned HTTP ${CODE}; deriving id from the releases list instead."
            REL=$(curl -sS "https://sentry.io/api/0/organizations/${SENTRY_ORG}/releases/?per_page=50" \
              -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" || printf '[]')
            PID=$(printf '%s' "$REL" | jq -r --arg slug "${SENTRY_PROJECT}" \
              '[.[].projects[]? | select(.slug == $slug) | .id] | first // empty')
          fi

          if [ -z "${PID}" ] || [ "${PID}" = "null" ]; then
            echo "::error::Could not resolve a numeric project id for slug '${SENTRY_PROJECT}'."
            echo "::error::Project-details endpoint returned HTTP ${CODE}, and no release in this"
            echo "::error::org referenced that slug."
            echo "::error::Check the SENTRY_PROJECT secret against the slug shown in the Sentry UI,"
            echo "::error::and confirm the token carries project:read."
            exit 1
          fi

          echo "project_id=${PID}" >> "$GITHUB_OUTPUT"
          echo "Resolved project '${SENTRY_PROJECT}' -> id ${PID}"

      - name: Resolve release SHA
        id: release
        env:
          CLIENT_PAYLOAD_SHA: ${{ github.event.client_payload.git.sha }}
          INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            SHA="${INPUT_RELEASE_SHA}"
          else
            SHA="${CLIENT_PAYLOAD_SHA}"
          fi
          # T-43-03 mitigation: regex-validate before passing to any curl URL path.
          if ! echo "${SHA}" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "::error::Invalid release SHA format: ${SHA}. Expected 40-char hex git SHA."
            exit 1
          fi
          SHORT="${SHA:0:7}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "Release SHA: ${SHA} (short: ${SHORT})"

      # Skippable on workflow_dispatch ONLY, and never on a real post-deploy
      # repository_dispatch. Smoke-testing this gate used to cost 30 minutes per
      # attempt, so every defect in the steps below took a full cycle to surface
      # — which is precisely why several shipped undetected for months.
      - name: Observation window
        if: github.event_name != 'workflow_dispatch' || inputs.skip_observation != true
        run: |
          echo "Sleeping ${OBSERVATION_WINDOW_MINUTES} minute(s) for Sentry to receive error/session signal..."
          sleep "${OBSERVATION_WINDOW_MINUTES}m"

      - name: Observation window SKIPPED
        if: github.event_name == 'workflow_dispatch' && inputs.skip_observation == true
        run: |
          echo "::warning title=Observation window skipped::Wiring smoke test only. Issue/session counts reflect whatever Sentry already holds, not a fresh post-deploy window, so the PASS/FAIL verdict is NOT meaningful as a regression signal."

      - name: Confirm release exists in Sentry
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://sentry.io/api/0/organizations/${SENTRY_ORG}/releases/${RELEASE_SHA}/" \
            -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}")
          if [ "${STATUS}" = "404" ]; then
            # Credentials were validated before the observation window, so the org
            # and token are known good by this point and a 404 here really does mean
            # the release is absent. Do not re-assert that without that preflight —
            # an org-scoped 404 was previously misread as a build failure for 40
            # consecutive runs.
            echo "::error::Sentry release ${RELEASE_SHA} not found, though the org and token resolved."
            echo "::error::So the Vercel build genuinely did not create a release for this commit."
            echo "::error::Check, in order:"
            echo "::error::  1. SENTRY_ORG / SENTRY_PROJECT / SENTRY_AUTH_TOKEN exist in the Vercel"
            echo "::error::     Production environment (the build uses those, NOT these GitHub secrets)"
            echo "::error::  2. release.name is set in next.config.ts withSentryConfig options — on"
            echo "::error::     Vercel there is no .git directory, so auto-detection finds nothing"
            echo "::error::  3. the Vercel build log for this commit, which names any plugin error"
            exit 1
          fi
          if [ "${STATUS}" != "200" ]; then
            echo "::error::Sentry releases API returned HTTP ${STATUS}. Check SENTRY_AUTH_TOKEN scopes (project:read required)."
            exit 1
          fi
          echo "Release ${RELEASE_SHA} confirmed in Sentry."

      - name: Query Sentry issues (new unresolved)
        id: sentry_issues
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -G -w '%{http_code}' "https://sentry.io/api/0/organizations/${SENTRY_ORG}/issues/" \
            -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
            --data-urlencode "project=${PROJECT_ID}" \
            --data-urlencode "environment=production" \
            --data-urlencode "query=release:${RELEASE_SHA} is:unresolved age:-${OBSERVATION_WINDOW_MINUTES}m" \
            --data-urlencode "sort=new" \
            --data-urlencode "limit=100" \
            -o current-issues.json 2>/tmp/issues.err) || true
          # curl writes the BODY to -o and the -w status to STDOUT, so the status
          # is captured from the command substitution, NOT read back out of the
          # body file. An earlier revision did `tail -1` on the -o file, which
          # returns the last line of the JSON and therefore never equals 200 —
          # it failed unconditionally regardless of what Sentry returned.
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Sentry issues API returned HTTP ${HTTP_CODE:-000}."
            echo "::error::Response body: $(head -c 700 current-issues.json 2>/dev/null)"
            echo "::error::curl stderr: $(head -c 200 /tmp/issues.err 2>/dev/null)"
            exit 1
          fi
          EVENT_COUNT=$(jq '[.[] | .count | tonumber] | add // 0' current-issues.json)
          NEW_ISSUE_COUNT=$(jq 'length' current-issues.json)
          echo "event_count_new_issues=${EVENT_COUNT}" >> "$GITHUB_OUTPUT"
          echo "new_issue_count=${NEW_ISSUE_COUNT}" >> "$GITHUB_OUTPUT"
          echo "Captured ${NEW_ISSUE_COUNT} new unresolved issue(s) with ${EVENT_COUNT} total events."

      - name: Query Sentry sessions (crash-free rate)
        id: sentry_sessions
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -G -w '%{http_code}' "https://sentry.io/api/0/organizations/${SENTRY_ORG}/sessions/" \
            -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
            --data-urlencode "project=${PROJECT_ID}" \
            --data-urlencode "environment=production" \
            --data-urlencode "field=sum(session)" \
            --data-urlencode "field=crash_free_rate(session)" \
            --data-urlencode "statsPeriod=1h" \
            --data-urlencode "query=release:${RELEASE_SHA}" \
            -o current-sessions.json 2>/tmp/sessions.err) || true
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Sentry sessions API returned HTTP ${HTTP_CODE:-000}."
            echo "::error::Response body: $(head -c 700 current-sessions.json 2>/dev/null)"
            exit 1
          fi
          # Default crash_free_rate to 1.0 if no sessions recorded yet (avoid false positive).
          CRASH_FREE=$(jq '[.groups[]? | select((.by // {}) | length == 0) | .totals["crash_free_rate(session)"]] | first // 1' current-sessions.json)
          ERROR_RATE_PCT=$(awk -v cf="${CRASH_FREE}" 'BEGIN { printf "%.4f", (1 - cf) * 100 }')
          echo "error_rate_pct=${ERROR_RATE_PCT}" >> "$GITHUB_OUTPUT"
          echo "Crash-free rate: ${CRASH_FREE} → error rate ${ERROR_RATE_PCT}%"

      - name: Query Sentry transactions (p95 — baseline only)
        id: sentry_transactions
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          # Baseline metric only — not gated per 43-RESEARCH.md line 654. Captured for
          # post-mortem trend analysis via the 90-day artifact.
          TX_CODE=$(curl -sS -G -w '%{http_code}' "https://sentry.io/api/0/organizations/${SENTRY_ORG}/events-stats/" \
            -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
            --data-urlencode "project=${PROJECT_ID}" \
            --data-urlencode "environment=production" \
            --data-urlencode "query=release:${RELEASE_SHA}" \
            --data-urlencode "yAxis=p95(transaction.duration)" \
            --data-urlencode "statsPeriod=1h" \
            -o current-transactions.json 2>/dev/null || true
          # Best-effort by design (p95 is recorded for the baseline but never
          # enforced), so a bad status does NOT fail the gate — it just leaves a
          # non-JSON body that the guarded jq below falls back to 0 for.
          if [ "${TX_CODE}" != "200" ]; then
            echo "::warning::Sentry events-stats returned HTTP ${TX_CODE:-000}; p95 recorded as 0."
            echo '{}' > current-transactions.json
          fi
          # events-stats response shape: { data: [[timestamp, [{count: <ms>}]], ...] }.
          # If query returns no data (low traffic), default to null.
          P95_MS=$(jq '[.data[]? | .[1][0].count // empty] | if length == 0 then 0 else (add / length) end' current-transactions.json 2>/dev/null || echo "0")
          echo "transactions_p95_ms=${P95_MS}" >> "$GITHUB_OUTPUT"
          echo "p95 transaction duration: ${P95_MS}ms"

      - name: Fetch previous release baseline (if any)
        id: baseline
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          # List all sentry-baseline-* artifacts, sort by created_at desc, skip the current-SHA
          # artifact (if this is a re-run), take the first remaining as the "previous" baseline.
          ARTIFACTS_JSON=$(gh api "repos/${REPO}/actions/artifacts?per_page=100" --jq \
            "[.artifacts[] | select(.name | startswith(\"sentry-baseline-\")) | select(.name != \"sentry-baseline-${RELEASE_SHA}\") | select(.expired == false)] | sort_by(.created_at) | reverse")
          PREV_COUNT=$(echo "${ARTIFACTS_JSON}" | jq 'length')
          if [ "${PREV_COUNT}" = "0" ]; then
            echo "No previous baseline found — this is the first gate run. Emitting first_run placeholder."
            echo '{"first_run": true}' > previous-snapshot.json
            echo "first_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREV_ARTIFACT_ID=$(echo "${ARTIFACTS_JSON}" | jq '.[0].id')
          PREV_ARTIFACT_NAME=$(echo "${ARTIFACTS_JSON}" | jq -r '.[0].name')
          echo "Previous baseline: ${PREV_ARTIFACT_NAME} (id ${PREV_ARTIFACT_ID})"
          # Download the artifact zip and extract snapshot.json
          gh api "repos/${REPO}/actions/artifacts/${PREV_ARTIFACT_ID}/zip" > prev.zip
          unzip -p prev.zip snapshot.json > previous-snapshot.json
          rm prev.zip
          echo "first_run=false" >> "$GITHUB_OUTPUT"
          echo "previous_sha=${PREV_ARTIFACT_NAME#sentry-baseline-}" >> "$GITHUB_OUTPUT"

      - name: Evaluate regression thresholds
        id: gate
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
          CURRENT_EVENT_COUNT: ${{ steps.sentry_issues.outputs.event_count_new_issues }}
          CURRENT_NEW_ISSUE_COUNT: ${{ steps.sentry_issues.outputs.new_issue_count }}
          CURRENT_ERROR_RATE_PCT: ${{ steps.sentry_sessions.outputs.error_rate_pct }}
          CURRENT_P95_MS: ${{ steps.sentry_transactions.outputs.transactions_p95_ms }}
          FIRST_RUN: ${{ steps.baseline.outputs.first_run }}
          PREVIOUS_SHA: ${{ steps.baseline.outputs.previous_sha }}
        run: |
          set -euo pipefail

          # Render current snapshot markdown for the summary / issue body.
          {
            echo "## Sentry Gate Result — ${SHORT_SHA}"
            echo ""
            echo "| Metric | Current | Previous | Threshold |"
            echo "|---|---|---|---|"
          } > gate-summary.md

          if [ "${FIRST_RUN}" = "true" ]; then
            STATUS="PASS_WITH_WARNING"
            REASON="No prior baseline artifact found — this is the first gate run. Baseline will be established after this release."
            {
              echo "| New-issue event count | ${CURRENT_EVENT_COUNT} | — | ${NEW_ISSUE_EVENT_THRESHOLD} |"
              echo "| Error rate % | ${CURRENT_ERROR_RATE_PCT} | — | Δ ${ERROR_RATE_DELTA_PCT} |"
              echo "| p95 transaction (ms) | ${CURRENT_P95_MS} | — | (baseline only) |"
              echo ""
              echo "**Status:** PASS_WITH_WARNING — ${REASON}"
            } >> gate-summary.md
            echo "gate_status=PASS_WITH_WARNING" >> "$GITHUB_OUTPUT"
            echo "gate_reason=${REASON}" >> "$GITHUB_OUTPUT"
            cat gate-summary.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          PREV_ERROR_RATE=$(jq -r '.error_rate_pct // 0' previous-snapshot.json)
          PREV_EVENT_COUNT=$(jq -r '.event_count_new_issues // 0' previous-snapshot.json)
          PREV_P95=$(jq -r '.transactions_p95_ms // 0' previous-snapshot.json)

          # Rule 1: new-issue event-count absolute threshold.
          EVENT_BREACH=$(awk -v c="${CURRENT_EVENT_COUNT}" -v t="${NEW_ISSUE_EVENT_THRESHOLD}" 'BEGIN { exit !(c > t) }' && echo "1" || echo "0")

          # Rule 2: error-rate delta.
          DELTA=$(awk -v c="${CURRENT_ERROR_RATE_PCT}" -v p="${PREV_ERROR_RATE}" 'BEGIN { printf "%.4f", c - p }')
          RATE_BREACH=$(awk -v d="${DELTA}" -v t="${ERROR_RATE_DELTA_PCT}" 'BEGIN { exit !(d > t) }' && echo "1" || echo "0")

          {
            echo "| New-issue event count | ${CURRENT_EVENT_COUNT} | ${PREV_EVENT_COUNT} | > ${NEW_ISSUE_EVENT_THRESHOLD} |"
            echo "| Error rate % | ${CURRENT_ERROR_RATE_PCT} | ${PREV_ERROR_RATE} | Δ > ${ERROR_RATE_DELTA_PCT} (actual Δ: ${DELTA}) |"
            echo "| p95 transaction (ms) | ${CURRENT_P95_MS} | ${PREV_P95} | (baseline only) |"
            echo ""
            echo "**Previous release:** \`${PREVIOUS_SHA}\`"
          } >> gate-summary.md

          if [ "${EVENT_BREACH}" = "1" ]; then
            STATUS="FAIL"
            REASON="New-issue event count ${CURRENT_EVENT_COUNT} exceeded threshold ${NEW_ISSUE_EVENT_THRESHOLD}."
          elif [ "${RATE_BREACH}" = "1" ]; then
            STATUS="FAIL"
            REASON="Error-rate delta ${DELTA}% exceeded threshold ${ERROR_RATE_DELTA_PCT}%."
          else
            STATUS="PASS"
            REASON="All thresholds within bounds."
          fi

          {
            echo ""
            echo "**Status:** ${STATUS} — ${REASON}"
          } >> gate-summary.md

          echo "gate_status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "gate_reason=${REASON}" >> "$GITHUB_OUTPUT"
          cat gate-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open regression issue
        if: steps.gate.outputs.gate_status == 'FAIL'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
          GATE_REASON: ${{ steps.gate.outputs.gate_reason }}
        run: |
          set -euo pipefail
          SENTRY_RELEASE_URL="https://sentry.io/organizations/${SENTRY_ORG}/releases/${RELEASE_SHA}/"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            cat gate-summary.md
            echo ""
            echo "---"
            echo ""
            echo "- **Sentry release:** ${SENTRY_RELEASE_URL}"
            echo "- **Actions run:** ${RUN_URL}"
            echo "- **Gate reason:** ${GATE_REASON}"
          } > issue-body.md
          ISSUE_URL=$(gh issue create \
            --title "Sentry regression detected in ${SHORT_SHA}" \
            --body-file issue-body.md \
            --label "sentry-regression,deploy-gate" 2>&1) || {
            echo "::warning::gh issue create failed: ${ISSUE_URL}"
            exit 0
          }
          echo "Opened issue: ${ISSUE_URL}"
          echo "**Issue:** ${ISSUE_URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Exit with gate status
        if: always()
        env:
          GATE_STATUS: ${{ steps.gate.outputs.gate_status }}
        run: |
          case "${GATE_STATUS}" in
            FAIL)
              echo "::error::Sentry regression gate FAILED — see gate-summary.md and opened issue."
              exit 1
              ;;
            PASS_WITH_WARNING)
              echo "::notice::Sentry regression gate PASS_WITH_WARNING (first run baseline established)."
              exit 0
              ;;
            PASS)
              echo "Sentry regression gate PASS."
              exit 0
              ;;
            *)
              # Reached when an earlier step exited non-zero, which has already
              # printed a specific ::error:: line. Repeating "evaluate step may
              # have failed" on top of that buried the real message.
              echo "::error::Gate did not reach evaluation — an earlier step failed and reported the reason above."
              exit 1
              ;;
          esac

      # Only snapshot REAL data.
      #
      # This was `if: always()`, and the defaults below (`${EVENT_COUNT:-0}`,
      # `${ERROR_RATE:-0}`) meant a run that failed BEFORE the queries still
      # wrote a snapshot asserting zero errors and zero error-rate — then
      # uploaded it as `sentry-baseline-<sha>`. The next run picks the most
      # recent baseline as its comparison point, so a failed run silently became
      # the baseline for the following one, and real numbers measured against a
      # fabricated zero read as a regression.
      #
      # Observed 2026-07-28: the first run to clear the credentials check failed
      # at the issues query and still uploaded a 329-byte all-zero baseline.
      #
      # Guarding on the two query steps means a snapshot exists only when
      # event_count and error_rate were actually measured. A failed run now
      # leaves the previous good baseline in place instead of overwriting the
      # comparison with fiction.
      - name: Build snapshot JSON
        if: always() && steps.sentry_issues.outcome == 'success' && steps.sentry_sessions.outcome == 'success'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          EVENT_COUNT: ${{ steps.sentry_issues.outputs.event_count_new_issues }}
          ERROR_RATE: ${{ steps.sentry_sessions.outputs.error_rate_pct }}
          P95_MS: ${{ steps.sentry_transactions.outputs.transactions_p95_ms }}
          GATE_STATUS: ${{ steps.gate.outputs.gate_status }}
          GATE_REASON: ${{ steps.gate.outputs.gate_reason }}
        run: |
          set -uo pipefail
          CAPTURED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Prune issue objects to id/title/count/permalink — drop heavy Sentry fields.
          # Fall back to [] if current-issues.json was never created (early failure).
          if [ -f current-issues.json ]; then
            NEW_ISSUES=$(jq '[.[] | {id, title, count: (.count | tonumber), permalink}]' current-issues.json)
          else
            NEW_ISSUES="[]"
          fi
          jq -n \
            --arg sha "${RELEASE_SHA}" \
            --arg captured "${CAPTURED_AT}" \
            --argjson issues "${NEW_ISSUES}" \
            --arg ec "${EVENT_COUNT:-0}" \
            --arg er "${ERROR_RATE:-0}" \
            --arg p95 "${P95_MS:-0}" \
            --arg gs "${GATE_STATUS:-UNKNOWN}" \
            --arg gr "${GATE_REASON:-no reason recorded}" \
            '{
              release_sha: $sha,
              captured_at: $captured,
              new_issues: $issues,
              event_count_new_issues: ($ec | tonumber),
              error_rate_pct: ($er | tonumber),
              transactions_p95_ms: ($p95 | tonumber),
              gate_status: $gs,
              gate_reason: $gr
            }' > snapshot.json
          echo "Snapshot written:"
          cat snapshot.json

      # `always()` alone made this step fire on runs that failed BEFORE the
      # snapshot was written — every credentials or release-lookup failure — and
      # `if-no-files-found: error` then added a second, misleading "no files"
      # error on top of the real one, on every failed run to date.
      #
      # Guarding on the file existing keeps `if-no-files-found: error` meaningful
      # (it still catches a genuinely empty snapshot after the evaluate step ran)
      # while letting a real failure report only its own cause.
      #
      # hashFiles() resolves relative to GITHUB_WORKSPACE, and snapshot.json is
      # written by the "Build snapshot JSON" step above with a bare relative
      # path, i.e. into the step's working directory, which is GITHUB_WORKSPACE.
      # So the guard sees the same file the upload would. (An earlier revision
      # of this comment said the evaluate step writes it — it does not.)
      #
      # This guard is now belt-and-braces: the build step's own condition
      # already prevents a snapshot from existing unless the queries succeeded.
      - name: Upload baseline artifact
        if: always() && hashFiles('snapshot.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentry-baseline-${{ steps.release.outputs.sha }}
          path: snapshot.json
          retention-days: 90
          if-no-files-found: error
