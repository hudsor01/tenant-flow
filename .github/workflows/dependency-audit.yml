name: Dependency Audit

# Audits `main`'s lockfile on a schedule. This exists for the cases GitHub's own
# Dependabot cannot signal, and for nothing else -- it is NOT a faster detector.
#
# What already covers the common case: Dependabot alerts and Dependabot security
# updates are both enabled on this repo, and security updates are NOT driven by
# the `interval:` in dependabot.yml (that governs version updates only). A new
# advisory matching the dependency graph raises an alert and opens a PR on its
# own, and that PR runs the full `checks` job, audit gate included.
#
# This job would also be LATER than that, not earlier: Dependabot reads GitHub's
# Advisory Database, while `bun audit` reads npm's bulk advisory endpoint, which
# lags GitHub review by hours. Measured during #1022: GHSA-mrhx-c7xc-m3w5 was
# absent from the npm feed at 20:00Z and present by 21:17Z, having sat in the
# GitHub DB unreviewed for 22 days before that. Do not read a green run here as
# evidence that nothing was published in the last few hours.
#
# What it does add, which nothing else in this repo reports:
#   1. An advisory with NO available patch. Dependabot "reports an error on the
#      alert" and opens no PR, so there is no PR and therefore no CI signal at
#      all. This is not hypothetical here: several of #1022's fixes needed
#      bounded `overrides` entries precisely because no patched release of the
#      dependent existed.
#   2. A Dependabot security PR that sits unmerged. npm auto-merge is disabled
#      outright in this repo by design (see dependabot.yml), so `main` can stay
#      vulnerable with only a quiet alert to show it.
#   3. Alerts going unread. A failed scheduled run is louder than an alert.
#
# It needs no `bun install`: `bun audit` reads bun.lock, not node_modules.
# Measured on a fresh checkout of main -- 1071 lockfile entries, no install --
# the audit itself takes 0.12s, so the run is almost entirely runner startup.
#
# It holds no production secrets, so unlike e2e-smoke and rls-security it must
# NOT join the `tenantflow-prod-test-account` concurrency group; it cannot
# contend with them.
on:
  schedule:
    # Daily 13:17 UTC. Off the top of the hour on purpose -- GitHub queues
    # scheduled runs and the hour boundary is the busiest slot -- and clear of
    # CodeQL (Mon 04:27 UTC) and RLS Security Tests (Mon 09:00 UTC).
    - cron: '17 13 * * *'
  workflow_dispatch:
  # Also run on a PR that touches the gate itself. Without this nothing in CI
  # exercises this workflow before it merges, and its invocation differs from
  # the `checks` job's in the way that matters: `checks` runs after
  # `bun install --frozen-lockfile`, while this job deliberately runs with no
  # node_modules at all. That path would otherwise never be tested.
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/dependency-audit.yml
      - .github/scripts/audit-gate.sh

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # The same script the `checks` job runs on every PR, including the
      # positive control -- without it a dead advisory feed would make this job
      # pass silently every day, which is the exact failure #1027 fixed.
      - name: Audit dependencies
        run: bash .github/scripts/audit-gate.sh
