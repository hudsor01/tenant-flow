name: Dependabot Auto-Merge

# Re-runs on every Dependabot push so existing PRs (opened before this
# workflow shipped) and new PRs both get evaluated. The actual merge is
# deferred via `gh pr merge --auto`, which holds the PR until required CI
# checks pass — branch protection on `main` requires checks / e2e-smoke /
# rls-security before any PR can merge.
#
# ⚠️ THAT PROTECTION IS WEAKER THAN IT LOOKS ON DEPENDABOT PRs. Two holes,
# both verified 2026-07-27:
#
#   1. `e2e-smoke` and `rls-security` report SUCCESS on Dependabot PRs
#      WITHOUT RUNNING — Dependabot-triggered runs get no Actions secret
#      scope, so they short-circuit (3-5s "passes"). Branch protection is
#      satisfied by a check that never executed.
#   2. When this workflow's auto-merge lands the commit, it is authored by
#      github-actions[bot] under GITHUB_TOKEN. GitHub's recursion guard then
#      suppresses the resulting push to `main` ENTIRELY — no CI, no e2e, no
#      CodeQL, no gitleaks. `check-runs` on the MERGE COMMIT for the
#      auto-merged next 16.2.11 bump (99cc8413) showed ONLY the post-deploy
#      Sentry gate. So there is no post-merge safety net.
#
# Net effect: a Dependabot PR that hits hole 1 AND is then auto-merged reaches
# production validated in neither place.
#
# PRECISION, because an earlier revision of this header overstated it: the
# next 16.2.11 bump was NOT such a case. Its PR head (3d1f4d8b, PR #928) ran
# e2e-smoke for 235s and rls-security for 122s — real executions — because a
# maintainer bun.lock commit had been pushed to it, and a maintainer commit
# changes the trigger context so the suites run for real. The empty merge-commit
# check-runs are explained by the recursion guard, not by absence of testing.
# The hole is real; that bump was not an instance of it. Do not re-cite it as
# one.
#
# Mitigation below: auto-merge is a POSITIVE ALLOWLIST, and as of 2026-07-27 it
# covers GitHub Actions patch/minor ONLY. No npm package auto-merges, in any
# ecosystem position — not production, not indirect, not dev tooling. Everything
# npm needs a human merge, which fires the push workflows normally (verified on
# #929).
#
# Two earlier revisions of this file got the npm rule wrong, in the same
# direction both times:
#   - the first excluded only `direct:production`, so `indirect` patches — which
#     ARE production-runtime code — still auto-merged, and `unknown` failed open;
#   - the second required `direct:development`, which does NOT mean "no indirect
#     deps present", because `indirect` ranks BELOW `direct:development` in
#     fetch-metadata's priority list and is masked by any dev dep in the same PR.
# The scalar `dependency-type` cannot express the property this guard needs. See
# the rule comment on the auto-merge step.
#
# To restore npm auto-merge safely (owner action, repo settings):
# add the two missing E2E passwords to the Dependabot secret scope under
# Settings > Secrets and variables > Dependabot. As of 2026-07-27 that scope
# holds NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
# E2E_OWNER_EMAIL and E2E_OWNER_B_EMAIL; E2E_OWNER_PASSWORD and
# E2E_OWNER_B_PASSWORD are still missing, so hole 1 remains open.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel any in-flight run for the same PR if Dependabot rebases mid-run;
# `gh pr merge --auto` is idempotent so a re-run on the latest head is
# always safe and saves runner-minutes during the monthly batch.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The enablePullRequestAutoMerge GraphQL mutation needs `contents: write`
# in addition to `pull-requests: write`. The actual merge commit is later
# created by GitHub's auto-merge runner under Dependabot's token, but the
# mutation that *flags* the PR for auto-merge is checked against the
# caller's repo-write scope. Without `contents: write` the mutation 422s
# with "Resource not accessible by integration".
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned by commit SHA per supply-chain best practice. SHA
      # 25dd0e34f4fe68f24cc83900b1fe3fe149efef98 is the v3.1.0 release — an
      # earlier comment here said v2.5.0, which did not match the pin.
      #
      # Bumping this action is NOT self-service: it arrives in the
      # github-actions group, which the rule below auto-merges for non-majors.
      # A non-major bump of fetch-metadata therefore lands without anyone
      # re-reading the semantics its outputs are relied on for. If the
      # `dependency-type` collapsing behaviour ever changes, review this file's
      # rule by hand before letting that bump merge.
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Auto-merge rules — a POSITIVE ALLOWLIST. Anything not named here needs a
      # human merge.
      #
      # It was previously a negative match (`dependency-type != direct:production`)
      # and that leaked twice over:
      #
      #   1. `indirect` still passed. fetch-metadata's `maxDependencyTypes()`
      #      resolves a grouped PR to the HIGHEST type present
      #      (direct:production > direct:development > indirect), so a patch group
      #      containing no direct-prod package resolves to `direct:development` or
      #      `indirect` — both of which satisfy `!= 'direct:production'`. Indirect
      #      npm dependencies are production-runtime code: they are transitive deps
      #      of next / react / @supabase/* / stripe and they execute in the Vercel
      #      runtime. dependabot.yml says so itself — `npm-patches` declares no
      #      `dependency-type`, so it captures indirect deps too.
      #
      #      This mattered most for the exact case the rule was written for.
      #      Dependabot SECURITY updates are not covered by the version-update
      #      groups (no `applies-to: security-updates`), so a transitive advisory
      #      fix arrives ungrouped as `indirect` + `semver-patch` — which the old
      #      guard auto-merged. That is the `next` 16.2.11 failure mode one
      #      dependency-graph level down.
      #
      #   2. It failed OPEN on unknown values. `maxDependencyTypes()` returns the
      #      literal string `unknown` when no dependency carries a recognised
      #      `dependency-type` (absent or unparseable Dependabot metadata), and
      #      `'unknown' != 'direct:production'` is true. A negative match fails
      #      open for every value nobody thought of.
      #
      #   3. AND — found 2026-07-27, after the allowlist above had already been
      #      written and merged — `direct:development` does NOT mean "no indirect
      #      deps present". The priority list is ORDERED
      #      ['direct:production','direct:development','indirect'] and
      #      `maxDependencyTypes()` returns the FIRST entry present, so `indirect`
      #      ranks BELOW `direct:development` and is MASKED by any dev dep sharing
      #      the PR. A group of {direct:development, indirect} reports
      #      `direct:development`.
      #
      #      Upstream's own test asserts exactly this — output.test.ts feeds
      #      [rspec direct:development, coffee-rails indirect, coffeescript
      #      indirect, rspec-coffeescript indirect] and expects
      #      `dependency-type == 'direct:development'`. Three indirect deps, and
      #      the scalar hides all of them.
      #
      #      `npm-patches` is precisely such a group: it declares no
      #      `dependency-type`, so it mixes direct and indirect freely. Any month
      #      whose patch batch contained one dev dep plus transitive production
      #      code would have auto-merged that transitive code.
      #
      # THE SCALAR CANNOT EXPRESS WHAT THIS GUARD NEEDS. "Contains no indirect"
      # is not derivable from a value that reports only the highest-ranked type.
      # A `contains(updated-dependencies-json, '"dependencyType":"indirect"')`
      # test would work but fails OPEN if that JSON's shape ever shifts, which is
      # the same class of bug three times over.
      #
      # So npm auto-merge is REMOVED entirely. What remains:
      #
      # - GitHub Actions patch/minor. Workflow files are CI-only and never reach
      #   prod artifacts, so a broken bump cannot affect users, and the ecosystem
      #   test does not depend on dependency-type at all. Matched POSITIVELY
      #   (== patch || == minor) rather than `!= major`, because `update-type` is
      #   empty when Dependabot's metadata trailer is absent and `'' != major`
      #   would have auto-merged it.
      #
      # Everything npm — including dev tooling — now falls through to manual
      # review. That is a real cost, paid deliberately: while e2e-smoke and
      # rls-security are vacuous on Dependabot PRs, a merge that a person
      # performs is the reliable way to get them executed. (A maintainer commit
      # pushed to the PR also un-vacuums them — that is what happened on #928 —
      # but that is not something the auto-merge path can rely on.)
      #
      # Restore npm auto-merge once BOTH hold, and prefer the
      # updated-dependencies-json test over the scalar when you do:
      #   - E2E_OWNER_PASSWORD / E2E_OWNER_B_PASSWORD exist in the Dependabot
      #     secret scope (the other four are already there)
      #   - the e2e-smoke and rls-security skip branches are deleted
      - name: Auto-merge if eligible
        if: |
          steps.meta.outputs.package-ecosystem == 'github_actions' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        # `--merge` matches the repo's allow_merge_commit=true /
        # allow_squash_merge=false setting (verified via the GitHub API).
        # Switching to `--squash` would 422 on the enable-auto-merge mutation.
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
