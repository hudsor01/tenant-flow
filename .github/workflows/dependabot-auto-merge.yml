name: Dependabot Auto-Merge

# Re-runs on every Dependabot push so existing PRs (opened before this
# workflow shipped) and new PRs both get evaluated. The actual merge is
# deferred via `gh pr merge --auto`, which holds the PR until required CI
# checks pass — branch protection on `main` requires checks / e2e-smoke /
# rls-security before any PR can merge.
#
# ⚠️ THAT PROTECTION IS WEAKER THAN IT LOOKS ON DEPENDABOT PRs. Two holes,
# both verified 2026-07-27:
#
#   1. `e2e-smoke` and `rls-security` report SUCCESS on Dependabot PRs
#      WITHOUT RUNNING — Dependabot-triggered runs get no Actions secret
#      scope, so they short-circuit (3-5s "passes"). Branch protection is
#      satisfied by a check that never executed.
#   2. When this workflow's auto-merge lands the commit, it is authored by
#      github-actions[bot] under GITHUB_TOKEN. GitHub's recursion guard then
#      suppresses the resulting push to `main` ENTIRELY — no CI, no e2e, no
#      CodeQL, no gitleaks. `check-runs` for the auto-merged next 16.2.11
#      bump (99cc8413) showed ONLY the post-deploy Sentry gate.
#
# Net effect: an auto-merged bump can reach production validated NOWHERE.
# That is exactly what happened to next 16.2.10 -> 16.2.11 — a SECURITY
# release fixing four HIGH advisories, one of them a Turbopack proxy bypass
# in an app that gates auth in src/proxy.ts.
#
# Mitigation below: auto-merge is a POSITIVE ALLOWLIST — direct devDependency
# patch/minor bumps, and non-major GitHub Actions bumps. Nothing that can reach
# the production runtime is eligible, INCLUDING indirect (transitive) npm
# dependencies, and anything with unrecognised metadata fails closed. Everything
# else needs a human merge, which fires the push workflows normally (verified
# on #929).
#
# An earlier revision of this file excluded only `direct:production`. That still
# auto-merged `indirect` patches — which are production-runtime code — and failed
# open on `unknown`. See the rule comment on the auto-merge step for the detail.
#
# To restore full auto-merge safely (owner action, repo settings):
# add the E2E_OWNER_* / SUPABASE vars as Dependabot-scoped secrets under
# Settings > Secrets and variables > Dependabot. `gh secret list --app
# dependabot` is currently EMPTY, which is why hole 1 exists at all.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel any in-flight run for the same PR if Dependabot rebases mid-run;
# `gh pr merge --auto` is idempotent so a re-run on the latest head is
# always safe and saves runner-minutes during the monthly batch.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The enablePullRequestAutoMerge GraphQL mutation needs `contents: write`
# in addition to `pull-requests: write`. The actual merge commit is later
# created by GitHub's auto-merge runner under Dependabot's token, but the
# mutation that *flags* the PR for auto-merge is checked against the
# caller's repo-write scope. Without `contents: write` the mutation 422s
# with "Resource not accessible by integration".
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned by commit SHA per supply-chain best practice. v2.5.0 release.
      # Bump alongside any `dependabot/fetch-metadata` Dependabot bump in
      # the github-actions group.
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Auto-merge rules — a POSITIVE ALLOWLIST. Anything not named here needs a
      # human merge.
      #
      # It was previously a negative match (`dependency-type != direct:production`)
      # and that leaked twice over:
      #
      #   1. `indirect` still passed. fetch-metadata's `maxDependencyTypes()`
      #      resolves a grouped PR to the HIGHEST type present
      #      (direct:production > direct:development > indirect), so a patch group
      #      containing no direct-prod package resolves to `direct:development` or
      #      `indirect` — both of which satisfy `!= 'direct:production'`. Indirect
      #      npm dependencies are production-runtime code: they are transitive deps
      #      of next / react / @supabase/* / stripe and they execute in the Vercel
      #      runtime. dependabot.yml says so itself — `npm-patches` declares no
      #      `dependency-type`, so it captures indirect deps too.
      #
      #      This mattered most for the exact case the rule was written for.
      #      Dependabot SECURITY updates are not covered by the version-update
      #      groups (no `applies-to: security-updates`), so a transitive advisory
      #      fix arrives ungrouped as `indirect` + `semver-patch` — which the old
      #      guard auto-merged. That is the `next` 16.2.11 failure mode one
      #      dependency-graph level down.
      #
      #   2. It failed OPEN on unknown values. `maxDependencyTypes()` returns the
      #      literal string `unknown` when no dependency carries a recognised
      #      `dependency-type` (absent or unparseable Dependabot metadata), and
      #      `'unknown' != 'direct:production'` is true. A negative match fails
      #      open for every value nobody thought of.
      #
      # Both are fixed by naming what IS allowed:
      #
      # - Patch or minor updates to direct devDependencies. Dev tooling does not
      #   ship in the production bundle. Because `dependency-type` reports the
      #   highest type in the group, requiring `direct:development` rejects any
      #   group containing a production or indirect package.
      # - GitHub Actions non-major updates. Workflow files are CI-only and never
      #   reach prod artifacts, so a broken bump cannot affect users. The
      #   required-checks gate catches anything that breaks CI itself before
      #   merge. Majors stay excluded because a major Actions bump can break the
      #   merge gate for every other PR until reverted.
      #
      # Everything else — all production deps direct or indirect, all majors,
      # security-sensitive vendor groups, and anything with `unknown` metadata —
      # falls through to manual review. A human merge is currently the ONLY thing
      # that actually runs e2e-smoke and rls-security on a Dependabot change, so
      # "falls through" is the safe state, not a degraded one.
      #
      # Relax this only once Dependabot-scoped secrets exist AND the e2e-smoke
      # skip branch in ci-cd.yml is deleted — i.e. once the checks are real.
      - name: Auto-merge if eligible
        if: |
          (steps.meta.outputs.dependency-type == 'direct:development' &&
           (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
            steps.meta.outputs.update-type == 'version-update:semver-minor')) ||
          (steps.meta.outputs.package-ecosystem == 'github_actions' &&
           steps.meta.outputs.update-type != 'version-update:semver-major')
        # `--merge` matches the repo's allow_merge_commit=true /
        # allow_squash_merge=false setting (verified via the GitHub API).
        # Switching to `--squash` would 422 on the enable-auto-merge mutation.
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
