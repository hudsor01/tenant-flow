name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".planning/**"
      - ".vscode/**"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - ".planning/**"
      - ".vscode/**"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - name: Suppress git default branch hint
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & Typecheck
        run: bun run lint & bun run typecheck & wait

      - name: Build
        run: bun run build
        env:
          SKIP_ENV_VALIDATION: 'true'
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'placeholder'
          NEXT_PUBLIC_APP_URL: 'https://placeholder.vercel.app'
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: 'pk_test_placeholder'

  e2e-smoke:
    # Run on every PR and every push to main. Previously the job was
    # gated on push-to-main only (so every PR showed "e2e-smoke skipping"
    # while giving zero actual signal) and `continue-on-error: true`
    # meant even the post-merge run never failed CI.
    #
    # Dependabot handling: Dependabot-triggered runs on pull_request
    # events use the Dependabot secret scope (separate from Actions).
    # Mirroring the 6 E2E secrets into that scope is operationally
    # fragile (rotation drift), so on Dependabot PR events every
    # secret-dependent step short-circuits and the job reports `success`
    # to satisfy required-status-checks.
    #
    # The guards check BOTH `event_name == 'pull_request'` AND
    # `actor == 'dependabot[bot]'`, so a `push` event to `main` is not
    # short-circuited.
    #
    # DO NOT restore the claim this block used to make — that the post-merge
    # push "always runs regardless of who triggered the merge", so the
    # post-merge safety net stays intact. THAT IS FALSE, and it was the
    # load-bearing justification for skipping. When dependabot-auto-merge.yml
    # merges via GITHUB_TOKEN, GitHub's recursion guard suppresses the push
    # ENTIRELY — there is no post-merge run to be a safety net. See the NOTE on
    # the skip step below for the check-runs evidence.
    #
    # Auto-merge classes (see .github/workflows/dependabot-auto-merge.yml for
    # the authoritative conditional): patch OR minor bumps to direct
    # devDependencies, and non-major GitHub Actions bumps. Everything else —
    # all production deps direct AND indirect, all majors, supabase, stripe,
    # and anything with unrecognised metadata — flows through manual review.
    # A human merge is currently the only thing that actually executes this
    # suite on a Dependabot change.
    runs-on: ubuntu-latest
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 15
    env:
      CI: true
    steps:
      # NOTE: this job reports SUCCESS here without running anything. That is a
      # vacuous green, and it is deliberate only because Dependabot-triggered
      # runs get no Actions secret scope (see "Secret source: Dependabot" in the
      # run log) so the suite physically cannot authenticate.
      #
      # A previous version of this notice claimed "full suite runs post-merge on
      # main (push event sees Actions secret scope regardless of who triggered
      # the merge)". THAT WAS FALSE and it was load-bearing. When
      # dependabot-auto-merge.yml merges via GITHUB_TOKEN, GitHub's recursion
      # guard suppresses the resulting push entirely — no workflow runs at all.
      # Verified 2026-07-27: `gh api repos/.../commits/99cc8413/check-runs` (the
      # merge commit for the auto-merged next 16.2.11 bump) returned ONLY the
      # post-deploy Sentry gate. So there is no post-merge safety net.
      #
      # PRECISION, because an earlier revision of this comment overstated it:
      # that does NOT mean the 16.2.11 bump shipped untested. Its PR head
      # (3d1f4d8b, PR #928) ran e2e-smoke for 235s and rls-security for 122s —
      # real executions, not the 3-5s vacuous pass. A maintainer bun.lock commit
      # had been pushed to that PR, and a maintainer commit changes the trigger
      # context so the suites run for real. The merge commit showing only the
      # gate is explained by the recursion guard, NOT by absence of testing.
      #
      # The hole is nonetheless real, for the case that has no maintainer
      # commit: a pure Dependabot PR gets vacuous 3-5s greens here, and if it is
      # then auto-merged under GITHUB_TOKEN the push is suppressed, so it is
      # validated in neither place. That combination is what the auto-merge
      # allowlist exists to prevent.
      #
      # Mitigation now in place: dependabot-auto-merge.yml is a positive
      # allowlist (direct devDependency patch/minor, non-major GitHub Actions).
      # Nothing that can reach the production runtime — including indirect
      # dependencies — is eligible, so it requires a human merge, and a human
      # merge fires the push workflows normally (verified on #929, same day).
      #
      # Proper fix, requires a repo-settings change (owner action): add the
      # E2E_OWNER_* / SUPABASE vars as **Dependabot-scoped secrets**
      # (Settings > Secrets and variables > Dependabot). `gh secret list --app
      # dependabot` is currently EMPTY. Populating it lets this job run for
      # real on Dependabot PRs and this whole skip branch can be deleted.
      - name: Skip notice on Dependabot PRs
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        run: |
          echo "::warning title=e2e-smoke did not run::This job reported success WITHOUT executing. Dependabot PRs receive no Actions secret scope, so the suite cannot authenticate. This PR has NOT been e2e-tested."
          {
            echo "### e2e-smoke: SKIPPED (vacuous green)"
            echo
            echo "This job reported success **without running any tests**."
            echo
            echo "- Cause: Dependabot-triggered runs get no Actions secret scope."
            echo "- This PR has **not** been e2e-tested by this check."
            echo "- Auto-merge is restricted to non-production dependencies for exactly this reason."
            echo "- To make this check real: add Dependabot-scoped secrets (see comment in ci-cd.yml)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Suppress git default branch hint
        if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
        with:
          fetch-depth: 1

      # Fail hard when any required secret is missing. Same pattern as
      # rls-security-tests.yml — a gate that silently skips is worse
      # than no gate because it masks real problems behind green checks.
      - name: Check required secrets
        if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
        run: |
          missing=()
          [ -z "$OWNER_EMAIL" ]              && missing+=(E2E_OWNER_EMAIL)
          [ -z "$OWNER_PASS" ]               && missing+=(E2E_OWNER_PASSWORD)
          [ -z "$SUPABASE_URL" ]             && missing+=(NEXT_PUBLIC_SUPABASE_URL)
          [ -z "$SUPABASE_PUBLISHABLE_KEY" ] && missing+=(NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub repo secrets: ${missing[*]}"
            echo "::error::Add them in Settings → Secrets and variables → Actions before this gate can pass."
            exit 1
          fi
          echo "All required secrets present"
        env:
          OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          OWNER_PASS: ${{ secrets.E2E_OWNER_PASSWORD }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
        with:
          node-version: "24"

      - name: Install dependencies
        if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
        run: bunx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
        run: bunx playwright test --config tests/e2e/playwright.config.ts --project=smoke --project=public --project=owner-axe
        env:
          SKIP_ENV_VALIDATION: 'true'
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload Playwright report on failure
        if: failure() && (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7
