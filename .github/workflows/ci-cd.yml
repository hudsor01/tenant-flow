name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".planning/**"
      - ".vscode/**"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - ".planning/**"
      - ".vscode/**"
      - "docs/**"
      - "LICENSE"

# A superseded run must not hold or occupy the global
# `tenantflow-prod-test-account` queue slot that e2e-smoke below takes. The
# per-job `checks-*` group already dropped stale compile runs; e2e-smoke cannot
# also carry a cancel-on-supersede key, because a job may hold exactly one
# concurrency key and its key has to be the global account lock. Cancelling at
# the RUN level covers both, and mirrors what rls-security-tests.yml does.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - name: Suppress git default branch hint
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & Typecheck
        run: bun run lint & bun run typecheck & wait

      - name: Build
        run: bun run build
        env:
          SKIP_ENV_VALIDATION: 'true'
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'placeholder'
          NEXT_PUBLIC_APP_URL: 'https://placeholder.vercel.app'
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: 'pk_test_placeholder'

  e2e-smoke:
    # SERIALIZED AGAINST THE OTHER PRODUCTION-DATA JOB. e2e-smoke and
    # rls-security both authenticate as E2E_OWNER_EMAIL against the SAME
    # production project, and they used to start on the same second on every PR.
    # Two concurrent writers on one account is not a flake, it is a race with
    # two proven manifestations: a global-scope signOut in an e2e teardown
    # revoked the RLS suite's cached session mid-run (54 x 403 then 75 fallback
    # sign-ins), and RLS fixture cleanup deleted a property between the
    # dashboard test's RPC snapshot and its page render (expected 23, got 22).
    # A shared group with cancel-in-progress false makes them QUEUE rather than
    # cancel, so both still run on every PR -- sequentially. Costs wall time;
    # buys a suite that measures the product instead of the other job.
    #
    # The durable fix is a separate synthetic account per suite, which needs new
    # credentials the CI cannot mint for itself. Recorded in deferred-items.
    #
    # THIS REPLACES the job's previous `e2e-${{ github.ref }}` group, which
    # cancelled a superseded e2e run when a new commit landed. A job may hold
    # exactly one concurrency key, and the two wanted opposite behaviour --
    # cancel-in-progress true to drop stale runs, false to queue behind
    # rls-security. Queueing wins: a cancelled run costs minutes, whereas two
    # writers on one production account costs a green suite that measured the
    # other job. Rapid pushes now queue e2e runs instead of superseding them.
    #
    # `queue: max` IS LOAD-BEARING, NOT A TUNING KNOB. A concurrency group holds
    # exactly ONE pending entry by default, and GitHub cancels that entry when a
    # newer one arrives -- "any existing pending job or workflow in the same
    # concurrency group will be canceled and the new queued job or workflow will
    # take its place". Since e2e-smoke and rls-security are different workflows
    # triggered by the same event, every push puts one of them in that single
    # pending slot, and the next push evicts it. Observed on PR #980: three
    # pushes in five minutes, and e2e-smoke on the head commit started at
    # 01:27:14Z and was cancelled at 01:27:15Z while `checks` in the same run
    # passed. e2e-smoke is a REQUIRED check, so eviction blocks the merge until
    # somebody re-runs the job by hand -- the serialization traded a racing
    # suite for a lost required check. `queue: max` raises the pending depth to
    # 100 and processes FIFO, which is what "queue instead of cancel" needed all
    # along. It is rejected only in combination with cancel-in-progress: true.
    #
    # THE GROUP IS DELIBERATELY NOT KEYED ON `github.ref`. The resource being
    # protected is ONE production Supabase project and ONE owner account, which
    # is global -- so a per-ref key handed every open branch its own lock and
    # serialized nothing across them. Proven on 2026-09-15 at 00:47 with three
    # branches in flight: the dashboard KPI test read the occupancy RPC three
    # times and got 29, then 14, then 29, while the page held steady at 17. That
    # is not a stale snapshot (the test already re-reads after render) -- another
    # ref's RLS suite was creating and deleting owner data underneath it. The
    # same contention is what made 253 blog prerenders start losing a 5s query
    # deadline. One global lock, FIFO.
    concurrency:
      group: tenantflow-prod-test-account
      cancel-in-progress: false
      queue: max

    # Run on every PR and every push to main. Previously the job was
    # gated on push-to-main only (so every PR showed "e2e-smoke skipping"
    # while giving zero actual signal) and `continue-on-error: true`
    # meant even the post-merge run never failed CI.
    #
    # Dependabot PRs run this for REAL as of 2026-07-27.
    #
    # They used to short-circuit: Dependabot-triggered runs read the Dependabot
    # secret scope, not the Actions scope, and that scope was EMPTY — so the
    # suite could not authenticate and the job reported `success` without
    # executing, in 3-5s. Branch protection was satisfied by a check that never
    # ran.
    #
    # That is fixed at the source. All six required secrets now exist in the
    # Dependabot scope (E2E_OWNER_EMAIL / E2E_OWNER_PASSWORD /
    # E2E_OWNER_B_EMAIL / E2E_OWNER_B_PASSWORD / NEXT_PUBLIC_SUPABASE_URL /
    # NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY), so every actor-based skip guard has
    # been deleted and the "Verify Supabase test credentials" step below is now the single
    # gate for everyone. If the Dependabot scope ever drifts, this job FAILS
    # LOUDLY instead of passing vacuously — which is the whole point.
    #
    # Do NOT reintroduce an `actor == 'dependabot[bot]'` skip. A gate that
    # silently reports success is worse than no gate: it launders an untested
    # change through branch protection.
    #
    # Related, and still true: when dependabot-auto-merge.yml merges under
    # GITHUB_TOKEN, GitHub's recursion guard suppresses the resulting push to
    # main entirely, so there is no post-merge run. PR-level checks are the only
    # validation an auto-merged bump gets — one more reason they must be real.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Suppress git default branch hint
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # VERIFY, DO NOT MERELY CHECK -- same shared action as rls-security, so
      # the two production-data jobs can no longer drift apart (this copy had
      # checked four secrets while the other checked ten). One real sign-in as
      # owner A, revoked immediately; on failure it names the pair, GoTrue's
      # error_code and which secret store this run read (Actions vs Dependabot).
      - name: Verify Supabase test credentials
        uses: ./.github/actions/verify-supabase-test-auth
        with:
          supabase-url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          publishable-key: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          credentials: |
            owner-a=${{ secrets.E2E_OWNER_EMAIL }}:${{ secrets.E2E_OWNER_PASSWORD }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: bunx playwright test --config tests/e2e/playwright.config.ts --project=smoke --project=public --project=owner-axe
        env:
          SKIP_ENV_VALIDATION: 'true'
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # REVOKE THE SYNTHETIC OWNER'S SESSIONS BEFORE ANYTHING IS UPLOADED.
      # On a failed or retried spec Playwright writes a trace into
      # test-results/, and a trace captures request headers and cookies --
      # the owner's live production access and refresh tokens. That directory
      # is about to be published as an artifact of a PUBLIC repo for 30 days.
      # A global sign-out invalidates every session and refresh token for the
      # account, so whatever a trace carries is dead on arrival (access tokens
      # expire within the hour on their own). scope=global is safe here only
      # because e2e-smoke and rls-security are serialised by the
      # tenantflow-prod-test-account group -- nothing else holds a session.
      # Never fails the job: a revoke that cannot sign in has nothing to revoke.
      - name: Revoke test-account sessions
        id: revoke
        if: always()
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
        run: |
          # `shell: bash` runs this under `bash -eo pipefail`; -e must be turned
          # OFF explicitly or any non-zero line fails the step and therefore the
          # required check. This step must never fail the job: a revoke that
          # cannot happen is reported, and the upload below reacts to it.
          set +e -u -o pipefail
          revoked=false
          token_url="${SUPABASE_URL%/}/auth/v1/token?grant_type=password"
          logout_url="${SUPABASE_URL%/}/auth/v1/logout?scope=global"
          body=$(EM="$EMAIL" PW="$PASSWORD" jq -cn '{email:env.EM,password:env.PW}')
          # Up to 3 attempts with backoff: a 429 or a transient 5xx from GoTrue
          # must not be mistaken for "no session to revoke".
          for attempt in 1 2 3; do
            access=$(curl -sS --max-time 30 -X POST "$token_url" \
                       -H "apikey: $PUBLISHABLE_KEY" -H 'Content-Type: application/json' \
                       -d @- <<<"$body" | jq -r '.access_token // empty' 2>/dev/null)
            if [ -n "$access" ]; then
              # Branch on the HTTP status, not curl's exit code: without -f curl
              # exits 0 for 401/403/429/500 too. GoTrue answers 204 on success.
              status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -X POST "$logout_url" \
                         -H "apikey: $PUBLISHABLE_KEY" -H "Authorization: Bearer $access")
              if [ "$status" = "204" ]; then revoked=true; break; fi
              echo "attempt $attempt: logout returned HTTP ${status:-000}"
            else
              echo "attempt $attempt: sign-in returned no access token"
            fi
            sleep $((attempt * 3))
          done
          if [ "$revoked" = true ]; then
            echo "revoked all sessions for the e2e owner"
          else
            echo "::warning::could not revoke the e2e owner's sessions after 3 attempts; test-results/ (traces) will be withheld from the artifact"
          fi
          echo "revoked=$revoked" >> "$GITHUB_OUTPUT"

      # Upload on every non-cancelled outcome, not only `failure()`: a run that
      # passed on RETRY ("1 flaky") is green to the required check but carries
      # the trace of a real defect, and `failure()` threw it away. The previous
      # path was `playwright-report/` at the repo root; the html reporter
      # resolves its outputFolder relative to the CONFIG file, so reports live
      # under tests/e2e/ and three failed runs in a row logged "No files were
      # found". test-results/ holds the per-test traces and screenshots.
      #
      # TWO steps, gated on the revoke outcome. Traces capture request headers
      # and cookies -- the owner's live session -- so test-results/ is published
      # ONLY when every session was just revoked (the tokens inside are dead).
      # If the revoke could not be confirmed, the html/json/junit report still
      # ships (it carries no credentials) and the traces stay on the runner.
      - name: Upload Playwright report and traces
        if: ${{ !cancelled() && steps.revoke.outputs.revoked == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # run_attempt makes the name unique per re-run: upload-artifact v4+
          # treats artifacts as immutable, so a "Re-run failed jobs" that
          # uploads the same name again would 409 and fail the required check.
          name: playwright-report-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Playwright report only (sessions not revoked)
        if: ${{ !cancelled() && steps.revoke.outputs.revoked != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.sha }}-${{ github.run_attempt }}
          path: tests/e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 30
