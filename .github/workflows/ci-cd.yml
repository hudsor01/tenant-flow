name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".planning/**"
      - ".vscode/**"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - ".planning/**"
      - ".vscode/**"
      - "docs/**"
      - "LICENSE"

# A superseded run must not hold or occupy the global
# `tenantflow-prod-test-account` queue slot that e2e-smoke below takes. The
# per-job `checks-*` group already dropped stale compile runs; e2e-smoke cannot
# also carry a cancel-on-supersede key, because a job may hold exactly one
# concurrency key and its key has to be the global account lock. Cancelling at
# the RUN level covers both, and mirrors what rls-security-tests.yml does.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    # 20, NOT 10, AND THE SPREAD IS WHY. Before this job ran the unit suite it
    # took 77s, 79s, 101s and 111s (runs 40172506038, 40172153921, 40170537681,
    # 40170507336); with it, 228s, 385s and 389s (40212669666, 40210200799,
    # 40209444394). The slowest observed run left 3.5 minutes against the old
    # 10-minute cap -- and runner variance alone is nearly 2x, on a suite that
    # only grows. That is how a required check starts failing on timeout for
    # reasons nobody changed.
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Suppress git default branch hint
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The audit gate lives in .github/scripts/audit-gate.sh, which this job and
      # the daily dependency-audit.yml both invoke, so the two cannot drift apart.
      # That file's header carries the rationale: why the level is high and
      # moderate/low only report, why it fails CLOSED and what had to be added to
      # make that true, why the positive control exists, and why an override floor
      # belongs in a bounded range rather than a bare `>=`.
      - name: Audit dependencies
        run: bash .github/scripts/audit-gate.sh

      - name: Lint & Typecheck
        # Sequential on purpose. This was `bun run lint & bun run typecheck &
        # wait`, and a bare `wait` returns 0 whatever the background jobs exited
        # with (POSIX), while `bash -e` ignores backgrounded commands -- so this
        # required step could not fail: every lint error, and every type error
        # in tests/** (which `next build` does not compile), passed CI.
        run: |
          bun run lint
          bun run typecheck

      # The credential gate (verify-supabase-test-auth) runs only in the jobs
      # that hit production, where it normally takes just its success path.
      # This runs its script locally, error and warning paths included, with a
      # stand-in for GoTrue answering the cases that need a response, so a
      # regression in which place an error names fails here instead of showing
      # up as a misleading message during a real outage.
      - name: Test the credential gate
        run: bash .github/actions/verify-supabase-test-auth/test.sh

      # THE SUITE CI DID NOT RUN. Until this step, the unit project ran ONLY in
      # lefthook's pre-commit hook -- and Dependabot commits skip every hook, so
      # for those the suite ran nowhere at all. That is not a theoretical gap. PR #1001 (react 19.2.8 -> 19.3.1, without react-dom)
      # passed `checks`, `e2e-smoke`, `rls-security`, CodeQL and `scan` while
      # failing 332 of 332 unit test files on `Incompatible React versions`
      # (measured locally -- CI could not have measured it, which is the point),
      # because react-dom asserts exact version equality with react and that
      # assert lives in its DEVELOPMENT bundle: `next build && next start` ships
      # production, where it is absent, while jsdom always evaluates it. Every
      # required check was green on a tree that could not run its own tests.
      #
      # WHAT THIS DOES NOT CLOSE, precisely: `checks` is `pull_request`-only, so
      # a commit pushed STRAIGHT to main still runs the suite nowhere. Branch
      # protection would normally make that unreachable, except `enforce_admins`
      # is false -- which scripts/platform-config-assertions.ts pins as the
      # documented state -- and the sole maintainer is an admin. Dependabot
      # opens pull requests, so the #1001 class above is genuinely closed; a
      # web-editor push straight to main is not.
      #
      # `--coverage` is not decoration: it is what applies the thresholds at the
      # root of vitest.config.ts (statements 64 / branches 56 / functions 63 /
      # lines 66 -- a ratchet at the measured floor, not an aspiration). Without
      # it, coverage could regress silently on exactly the commits that skip
      # lefthook.
      #
      # MEASURED ON RUNNERS, WITH THE RUN IDS, because one number from one run
      # is not what the next person sees. 336 files, and this step took 283s,
      # 278s and 156s on runs 40209444394, 40210200799 and 40212669666 -- nearly
      # 2x variance between runners, so budget for the slow end. Coverage is
      # stable across all three at 64.94 / 56.71 / 64.19 / 67.06.
      #
      # An 18-core dev box reports 64.98 / 56.8 / 64.19 / 67.07 on the same tree
      # in about 30s: v8 counts a few statements slightly differently between V8
      # versions (Node 24 here, 26 there -- an inference, not a measurement),
      # and the suite is slower here because UNIT_MAX_WORKERS is
      # `max(2, min(8, cpus - 1))`, which is 3 on a 4-core runner against 8
      # there. WHOEVER RAISES THE RATCHET NEXT SHOULD READ THE RUNNER'S FIGURES:
      # the branch floor has 0.71 points of headroom there, not the 0.79 a local
      # run suggests.
      #
      # This step also carries the negative controls for every other gate in
      # this repo whose assertions are plain tested code -- the migration-replay
      # comparisons, the platform-config drift checks, the shared result module,
      # both CLIs' exit codes, and the workflow contract with its twelve
      # committed mutated-fixture tests. Those tests are the reason "the gate
      # was green" means the gate can still fail.
      #
      # ONE KNOWN RISK IN PUTTING IT HERE. vitest.config.ts records an
      # intermittent worker-pool/setupFiles race (mass `Invalid Chai property`
      # failures, cleared by a re-run), and its own comment says the
      # UNIT_MAX_WORKERS hedge was "NOT empirically reproduced on lower-core
      # hardware" -- which is exactly this runner, at 3 workers against the
      # 18-core box where it measured 0/3. If `checks` ever goes red with mass
      # chai-property errors, re-run it before looking anywhere else.
      #
      # Before the build, which takes 51s-76s on the same three runs: a tree
      # that cannot run its tests should not wait on a bundler to find out.
      - name: Unit tests
        run: bun run test:unit -- --coverage

      - name: Build
        run: bun run build
        env:
          SKIP_ENV_VALIDATION: 'true'
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'placeholder'
          NEXT_PUBLIC_APP_URL: 'https://placeholder.vercel.app'
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: 'pk_test_placeholder'

  e2e-smoke:
    # SERIALIZED AGAINST THE OTHER PRODUCTION-DATA JOB. e2e-smoke and
    # rls-security both authenticate as E2E_OWNER_EMAIL against the SAME
    # production project, and they used to start on the same second on every PR.
    # Two concurrent writers on one account is not a flake, it is a race with
    # two proven manifestations: a global-scope signOut in an e2e teardown
    # revoked the RLS suite's cached session mid-run (54 x 403 then 75 fallback
    # sign-ins), and RLS fixture cleanup deleted a property between the
    # dashboard test's RPC snapshot and its page render (expected 23, got 22).
    # A shared group with cancel-in-progress false makes them QUEUE rather than
    # cancel, so both still run on every PR -- sequentially. Costs wall time;
    # buys a suite that measures the product instead of the other job.
    #
    # The durable fix is a separate synthetic account per suite, which needs new
    # credentials the CI cannot mint for itself. Recorded in deferred-items.
    #
    # THIS REPLACES the job's previous `e2e-${{ github.ref }}` group, which
    # cancelled a superseded e2e run when a new commit landed. A job may hold
    # exactly one concurrency key, and the two wanted opposite behaviour --
    # cancel-in-progress true to drop stale runs, false to queue behind
    # rls-security. Queueing wins: a cancelled run costs minutes, whereas two
    # writers on one production account costs a green suite that measured the
    # other job. Rapid pushes now queue e2e runs instead of superseding them.
    #
    # `queue: max` IS LOAD-BEARING, NOT A TUNING KNOB. A concurrency group holds
    # exactly ONE pending entry by default, and GitHub cancels that entry when a
    # newer one arrives -- "any existing pending job or workflow in the same
    # concurrency group will be canceled and the new queued job or workflow will
    # take its place". Since e2e-smoke and rls-security are different workflows
    # triggered by the same event, every push puts one of them in that single
    # pending slot, and the next push evicts it. Observed on PR #980: three
    # pushes in five minutes, and e2e-smoke on the head commit started at
    # 01:27:14Z and was cancelled at 01:27:15Z while `checks` in the same run
    # passed. e2e-smoke is a REQUIRED check, so eviction blocks the merge until
    # somebody re-runs the job by hand -- the serialization traded a racing
    # suite for a lost required check. `queue: max` raises the pending depth to
    # 100 and processes FIFO, which is what "queue instead of cancel" needed all
    # along. It is rejected only in combination with cancel-in-progress: true.
    #
    # THE GROUP IS DELIBERATELY NOT KEYED ON `github.ref`. The resource being
    # protected is ONE production Supabase project and ONE owner account, which
    # is global -- so a per-ref key handed every open branch its own lock and
    # serialized nothing across them. Proven on 2026-09-15 at 00:47 with three
    # branches in flight: the dashboard KPI test read the occupancy RPC three
    # times and got 29, then 14, then 29, while the page held steady at 17. That
    # is not a stale snapshot (the test already re-reads after render) -- another
    # ref's RLS suite was creating and deleting owner data underneath it. The
    # same contention is what made 253 blog prerenders start losing a 5s query
    # deadline. One global lock, FIFO.
    concurrency:
      group: tenantflow-prod-test-account
      cancel-in-progress: false
      queue: max

    # Run on every PR and every push to main. Previously the job was
    # gated on push-to-main only (so every PR showed "e2e-smoke skipping"
    # while giving zero actual signal) and `continue-on-error: true`
    # meant even the post-merge run never failed CI.
    #
    # Dependabot PRs run this for REAL as of 2026-07-27.
    #
    # They used to short-circuit: Dependabot-triggered runs read the Dependabot
    # secret scope, not the Actions scope, and that scope was EMPTY — so the
    # suite could not authenticate and the job reported `success` without
    # executing, in 3-5s. Branch protection was satisfied by a check that never
    # ran.
    #
    # That is fixed at the source. This job reads E2E_OWNER_EMAIL /
    # E2E_OWNER_PASSWORD; rls-security also reads E2E_OWNER_B_*, E2E_ADMIN_*
    # and SUPABASE_SECRET_KEY. All of them exist in the Dependabot scope, which
    # is why no actor-based skip guard is needed and the "Verify Supabase test
    # credentials" step below is the single gate for everyone. (The Supabase
    # URL and publishable key are repository variables, not secrets.) If the
    # Dependabot scope ever drifts, this job FAILS LOUDLY instead of passing
    # vacuously — which is the whole point.
    #
    # Do NOT reintroduce an `actor == 'dependabot[bot]'` skip. A gate that
    # silently reports success is worse than no gate: it launders an untested
    # change through branch protection.
    #
    # Related, and still true: when dependabot-auto-merge.yml merges under
    # GITHUB_TOKEN, GitHub's recursion guard suppresses the resulting push to
    # main entirely, so there is no post-merge run. PR-level checks are the only
    # validation an auto-merged bump gets — one more reason they must be real.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Suppress git default branch hint
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # VERIFY, DO NOT MERELY CHECK -- same shared action as rls-security, so
      # the two production-data jobs can no longer drift apart (this copy had
      # checked four secrets while the other checked ten). One real sign-in as
      # owner A, revoked immediately; on failure it names the pair and the cause,
      # the responder's code and message when there was a response, and where
      # the implicated value is stored only when a stored value is actually
      # implicated. That set is the action's contract, spelled out here and in
      # rls-security-tests.yml so neither caller can understate it: the secret
      # store this run read (Actions vs Dependabot) for 400/403 (the pair); the
      # repository variables page for 401 (the publishable key), 404 (a URL
      # serving no auth API) and a no-response (an unresolvable host makes the
      # URL a candidate); nothing for a 429 or for any other status, where
      # nothing identifies a stored value as the cause, so nobody rotates a
      # secret over a transient.
      - name: Verify Supabase test credentials
        uses: ./.github/actions/verify-supabase-test-auth
        with:
          supabase-url: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          publishable-key: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          credentials: |
            owner-a=${{ secrets.E2E_OWNER_EMAIL }}:${{ secrets.E2E_OWNER_PASSWORD }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        id: e2e
        run: bunx playwright test --config tests/e2e/playwright.config.ts --project=smoke --project=public --project=owner-axe
        env:
          SKIP_ENV_VALIDATION: 'true'
          # On any failure Playwright writes error-context.md, which embeds an
          # accessibility snapshot of the page INCLUDING input values -- for a
          # failed smoke login that is the typed production password. This flag
          # removes only the `# Page snapshot` section that _takePageSnapshot
          # adds; the file is still written with the error text and a source
          # frame, and a failure raised by a LOCATOR matcher still writes its
          # own aria snapshot (whole-body when the target is not visible) with
          # input values in it. The flag narrows that surface; the only reason
          # none of it is public is that this job uploads nothing.
          PLAYWRIGHT_NO_COPY_PROMPT: 'true'
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # REVOKE THE SYNTHETIC OWNER'S SESSIONS AFTER EVERY RUN (shared action,
      # same one rls-security uses for its three accounts). Defense in depth:
      # nothing is uploaded, but a global sign-out invalidates every session
      # and refresh token the run created. Runs on failure, cancellation and
      # job timeout, but NOT when the test step was skipped (gate or install
      # failed): the only session that can exist then is the gate's own probe,
      # which the gate signs out itself (scope=local) and warns about when it
      # cannot, and signing in again with a pair the gate just rejected would
      # only add three more failed attempts and a misleading warning. Never
      # fails the job.
      - name: Revoke test-account sessions
        if: ${{ always() && steps.e2e.outcome != 'skipped' }}
        uses: ./.github/actions/revoke-supabase-test-sessions
        with:
          supabase-url: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          publishable-key: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          credentials: |
            owner-a=${{ secrets.E2E_OWNER_EMAIL }}:${{ secrets.E2E_OWNER_PASSWORD }}

      # NOTHING LEAVES THE RUNNER WHILE CI AUTHENTICATES AGAINST PRODUCTION.
      # Review of this PR found, in order: traces, videos, screenshots and
      # page snapshots of a production login carry live credentials; the html
      # reporter copies every attachment into playwright-report/data/; and the
      # html report itself titles every typed value as `Fill "{value}"`
      # (playwright-core protocol metainfo, no redaction), so the login test
      # and its beforeAll hook put the owner's password in index.html on every
      # PASSING run. The json/junit summaries carry error messages, and a
      # failed fill() prints its value in the call log. No report is uploaded;
      # triage uses the job log, which GitHub masks. Reports return when the
      # stack is hermetic (realignment phase 2) and the credentials belong to
      # a throwaway database.
