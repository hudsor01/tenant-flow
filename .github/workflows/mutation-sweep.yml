name: Mutation Sweep

# Runs scripts/mutation-sweep.sh, which breaks each of its enumerated decision
# points in this repo's CI assertions and requires a control to fail for it.
#
# WHY THIS WORKFLOW EXISTS. Review of the pull request that added the sweep
# found that NOTHING RAN IT. The thesis of that work is "a gate that passes
# proves nothing until something has watched it fail" -- and the instrument
# establishing that for every other gate had no trigger, so `caught=52
# vacuous=0 not-applied=0` was a claim in a commit message. That is the exact
# shape of defect the sweep exists to eliminate, committed by the sweep.
#
# WEEKLY, NOT ON EVERY PULL REQUEST. Each row re-runs the `scripts` and
# `src/lib/__tests__` suites, about 17 s on a runner (almost all Vitest
# start-up), so the sweep costs the row count times that: 179 rows are about
# 52 minutes of runner time. `checks` has to stay fast enough to be a required
# check; this does not.
#
# SHARDED, SO A JOB'S RUNTIME DOES NOT GROW WITH THE ROW COUNT. As one job the
# sweep hit its 45-minute limit at row 155 of 179. The matrix below splits it
# into n shards: the script gives row r to shard ((r - 1) mod n) + 1, so each
# row runs in exactly one shard and the shards differ in size by at most one
# (scripts/mutation-sweep.test.ts proves the shards partition the rows). Each
# shard runs its own baseline and restore check and fails on its own VACUOUS,
# NOT APPLIED or empty result; `fail-fast: false` lets every shard report, and
# any failed shard fails the run. n is read from the matrix
# (`strategy.job-total`), so the shard list is the only place it is written.
#
# The script refuses to run on a dirty tree (it edits tracked files and restores
# them from a byte-exact backup through an EXIT trap), which a fresh checkout
# always satisfies. It exits non-zero if any row reports VACUOUS or NOT
# APPLIED, so the two outcomes that mean "this proves less than it claims" fail
# the job rather than scrolling past in a log.
#
# It holds no secrets and signs in to nothing, so it must NOT join the
# `tenantflow-prod-test-account` concurrency group.
on:
  schedule:
    # Sunday, in a slot no other workflow uses (codeql 04:27 Mon,
    # rls-security 09:00 Mon, migration-replay 12:41 Mon, dependency-audit
    # 13:17 daily, config-drift 07:17 daily).
    - cron: "23 3 * * 0"
  workflow_dispatch:
  # And on a pull request that changes the sweep or anything it mutates, so a
  # row that stops applying is caught before it merges rather than next Sunday.
  pull_request:
    branches: [main]
    paths:
      - scripts/mutation-sweep.sh
      - scripts/assertion-result.ts
      - scripts/migration-replay-assertions.ts
      - scripts/platform-config-assertions.ts
      - scripts/workflow-contract.ts
      - scripts/assert-migration-replay.ts
      - .github/workflows/mutation-sweep.yml

concurrency:
  group: mutation-sweep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    # One shard: at 179 rows, 8 shards hold at most 23. 23 x 17.3 s (the
    # per-row rate of the unsharded run that timed out) is 6.6 min, plus about
    # 30 s for set-up and the baseline: 7 min. 15 allows a runner twice as slow,
    # or twice the rows per shard, before it trips.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SWEEP_SHARD: ${{ matrix.shard }}
      SWEEP_SHARDS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Break every enumerated decision point and require a control to fail
        run: bash scripts/mutation-sweep.sh
